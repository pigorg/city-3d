<style>

      backdrop-filter:blur(6px);box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:13px;user-select:none;min-width:210px}

  button{background:#3b4150;color:#eef0f4;border:0;border-radius:7px;padding:6px 10px;font:inherit;cursor:pointer}

  #follow{margin-top:8px;color:#9fe3d2;min-height:16px}
  #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#d5d9e0;font-size:12px;opacity:.75;
        background:rgba(28,31,39,.5);padding:5px 12px;border-radius:20px;white-space:nowrap}
  #prompt{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:rgba(28,31,39,.85);color:#fff;padding:8px 16px;
          border-radius:10px;font-size:15px;font-weight:600;display:none;pointer-events:none}
  #speed{position:fixed;right:22px;bottom:22px;background:rgba(28,31,39,.8);color:#9fe3d2;padding:10px 16px;border-radius:12px;

         transition:opacity .4s;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none}

  #fade{position:fixed;inset:0;background:#000;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
  #marker{position:fixed;display:none;pointer-events:none;transform:translate(-50%,-50%)}
  #marker i{display:block;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;

  #marker b{position:absolute;left:50%;top:-24px;transform:translateX(-50%);background:#ff3b30;color:#fff;font-size:12px;
            padding:2px 7px;border-radius:8px;white-space:nowrap}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';
THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

/* =====================================================================
   COSTANTI
   ===================================================================== */
const TILE = 10, HALF = 5;
const NX = 17, NZ = 17;                       // griglia 17x17 tile da 10 unità → 4x4 isolati
const OZ = 45 - NZ * TILE / 2;                // il bordo sud della città resta a z=45 (lungomare)
const XW = NX * TILE / 2 + 1.5;               // mezza larghezza del plastico
const SIDEWALK = 1.5, SW_H = 0.3, LANE = 1.75; // marciapiede, altezza, offset corsia
const H2 = HALF - SIDEWALK / 2;
const CURB_IN = HALF - SIDEWALK + 0.38;          // pali/lampioni vicino al cordolo, lasciando spazio ai pedoni
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // N E S O  (x, z)
const isRoadIdx = (i, j) => i >= 0 && j >= 0 && i < NX && j < NZ && (i % 4 === 0 || j % 4 === 0);

/* RNG con seme, per città riproducibili */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = mulberry32(7);
const rand = (a, b) => a + (b - a) * R();
const pick = arr => arr[Math.floor(R() * arr.length)];
const mpick = arr => arr[Math.floor(Math.random() * arr.length)];

/* =====================================================================
   MATERIALI
   ===================================================================== */
const matCache = new Map();
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, ...opts }));
  return matCache.get(key);
}
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = glowTexture();
const CYCLE = 22;   // ciclo semaforico (s)
const LIGHT_MATS = [0, 1].map(() => {
  const mk = c => { const m = new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0, roughness: 0.4 }); m.userData.base = m.color.getHex(); return m; };
  return { r: mk('#ff3b30'), y: mk('#ffc928'), g: mk('#3ddc6a') };
});
const M = {
  asphalt: mat('#78737f'), pave: mat('#e3e3e8'), pave2: mat('#d6d6dc'), curb: mat('#f5f5f7'), line: mat('#f7f7f7'),
  baseSide: mat('#c3c4cc'), trim: mat('#e9e9ed'), roof: mat('#f2f2f4'), roofIn: mat('#d8d8de'), frame: mat('#f8f8f8'),
  glass: mat('#a6d8f0', { roughness: 0.25 }),
  glassLit: new THREE.MeshStandardMaterial({ color: '#a6d8f0', roughness: 0.25, emissive: '#ffcf7a', emissiveIntensity: 0 }),
  dark: mat('#41444c'), pole: mat('#8d929c'), tire: mat('#2c2d33'), hub: mat('#d5d7dc'), bumper: mat('#d9dade'),
  headlight: new THREE.MeshStandardMaterial({ color: '#fff8e0', emissive: '#fff2c0', emissiveIntensity: 0.2 }),
  tail: new THREE.MeshStandardMaterial({ color: '#e8423a', emissive: '#ff2a1a', emissiveIntensity: 0.15 }),
  lamp: new THREE.MeshStandardMaterial({ color: '#fff6d0', emissive: '#ffe39a', emissiveIntensity: 0.25 }),
  hydrant: mat('#d83a2e'), signBlue: mat('#3f7fe0'), grass: mat('#9bd37f'), water: mat('#7cc7ec', { roughness: 0.2 }),
  leaf: mat('#6cc06a', { flatShading: true }), leaf2: mat('#4fae63', { flatShading: true }), trunk: mat('#9a7356'),
  tank: mat('#dcc58a'), tankBand: mat('#b89e62'), tankRoof: mat('#f0cf5a'), wood: mat('#c79a6b'),
  glow: new THREE.MeshBasicMaterial({ map: glowTex, color: '#ffd68a', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }),
  beam: new THREE.MeshBasicMaterial({ map: glowTex, color: '#fff1c8', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }),
  // mare, spiaggia, porto
  sand: mat('#f0d9a0'), sandWet: mat('#e2c587'),
  sea: Object.assign(new THREE.MeshStandardMaterial({ color: '#79cdef', roughness: 0.12, metalness: 0.05 }), { userData: { keep: true } }),
  foam: new THREE.MeshBasicMaterial({ map: glowTex, color: '#ffffff', transparent: true, opacity: 0.6, depthWrite: false }),
  lhBeam: new THREE.MeshBasicMaterial({ map: glowTex, color: '#fff2b0', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }),
  plank: mat('#c9a57a'), plankDark: mat('#9c7a55'), concrete: mat('#d0d2d9'), rubber: mat('#2b2c31'),
  hullW: mat('#f7f8fa'), hullB: mat('#2c58bd'), hullR: mat('#d63b3b'), deck: mat('#dcb98a'), navy: mat('#24365e'),
  glassDark: mat('#34465f', { roughness: 0.2 }), pool: mat('#62cbf0', { roughness: 0.15 }), deckGreen: mat('#73c36e'),
  lifeboat: mat('#f39a2c'), sailRed: mat('#d9483a', { side: THREE.DoubleSide }), sailW: mat('#fafafa', { side: THREE.DoubleSide }),
  craneY: mat('#f2c230'), craneR: mat('#e0533c'),
  lightHouse: new THREE.MeshStandardMaterial({ color: '#fff6d0', emissive: '#ffe08a', emissiveIntensity: 0.3 }),
  // polizia e persone
  polBlue: mat('#2453b0'), polNavy: mat('#1e2a47'), gold: mat('#f0c232', { metalness: 0.3, roughness: 0.4 }), shoe: mat('#1b1c20'),
  sirenR: new THREE.MeshStandardMaterial({ color: '#ff3b30', emissive: '#ff2015', emissiveIntensity: 0.2 }),
  sirenB: new THREE.MeshStandardMaterial({ color: '#2f6bff', emissive: '#1f5bff', emissiveIntensity: 0.2 }),
};

/* =====================================================================
   HELPER GEOMETRIE  (y = base dell'oggetto)
   ===================================================================== */
function box(p, w, h, d, m, x = 0, y = 0, z = 0) {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y + h / 2, z); p.add(o); return o;
}
function rbox(p, w, h, d, r, m, x = 0, y = 0, z = 0) {
  const o = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, r), m); o.position.set(x, y + h / 2, z); p.add(o); return o;
}
function cyl(p, rt, rb, h, m, x = 0, y = 0, z = 0, seg = 12) {
  const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m); o.position.set(x, y + h / 2, z); p.add(o); return o;
}
// box in un sistema locale al tile: "along" verso il lato s, "lat" verso il lato s+1
function pbox(p, cx, cz, s, along, lat, lenA, lenL, h, m, y = 0) {
  const [ax, az] = DIRS[s], [lx, lz] = DIRS[(s + 1) % 4];
  const x = cx + ax * along + lx * lat, z = cz + az * along + lz * lat;
  return ax !== 0 ? box(p, lenA, h, lenL, m, x, y, z) : box(p, lenL, h, lenA, m, x, y, z);
}
function fr(cx, cz, s, along, lat) {
  const [ax, az] = DIRS[s], [lx, lz] = DIRS[(s + 1) % 4];
  return [cx + ax * along + lx * lat, cz + az * along + lz * lat];
}

/* Unisce tutte le mesh statiche di un gruppo → pochissime draw call.
   I materiali "semplici" finiscono in un'unica mesh con i colori nei vertici (VC_MAT);
   quelli speciali (emissivi, trasparenti, con texture, animati) restano separati per materiale. */
const VC_MAT = new THREE.MeshLambertMaterial({ vertexColors: true });
const vcMergeable = m => m.isMeshStandardMaterial && !m.vertexColors && !m.map && !m.transparent && m.side === THREE.FrontSide
  && m.emissive.getHex() === 0 && !m.userData.keep;
function bake(root, cell = 0) {               // cell > 0: unisce per blocchi spaziali (culling della vista e delle ombre)
  root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
  const buckets = new Map(), remove = [];
  let brk = null;                                        // gruppi distruttibili: si ricorda quali vertici occupano nella mappa unita
  if (cell) { brk = new Map(); root.traverse(o => { if (o.userData.breakable) { const rec = { kind: o.userData.breakable, template: o.clone(true), matrix: new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld), ranges: [], broken: false }; brk.set(o, rec); BREAKABLES.push(rec); } }); }
  root.traverse(o => {
    if (!o.isMesh) return;
    for (let p = o; p && p !== root; p = p.parent) if (p.userData.dynamic) return;
    const geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    for (const k of Object.keys(geo.attributes)) if (!['position', 'normal', 'uv', 'color'].includes(k)) geo.deleteAttribute(k);
    geo.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
    let key = o.material;
    if (o.material === VC_MAT) key = VC_MAT;          // già cotto in precedenza
    else if (vcMergeable(o.material)) {
      key = VC_MAT;
      if (o.material.flatShading) geo.computeVertexNormals();   // geometria non indicizzata → normali per faccia
      const c = o.material.color, n = geo.attributes.position.count, arr = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
      geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
      if (cell) { const t = texFor(o.material); if (t) { key = TEX_MATS[t]; worldUV(geo, TEX_SCALE[t]); } }
    } else if (geo.attributes.color) geo.deleteAttribute('color');
    let ck = '';
    if (cell) { geo.computeBoundingBox(); const c = geo.boundingBox.getCenter(new THREE.Vector3()); ck = Math.floor(c.x / cell) + ',' + Math.floor(c.z / cell); }
    if (!buckets.has(key)) buckets.set(key, new Map());
    const bm = buckets.get(key); if (!bm.has(ck)) bm.set(ck, []);
    if (brk) for (let q = o.parent; q && q !== root; q = q.parent) if (brk.has(q)) { geo.userData.brec = brk.get(q); break; }
    bm.get(ck).push(geo);
    o.geometry.dispose(); remove.push(o);
  });
  remove.forEach(o => o.parent.remove(o));
  for (const [m, bm] of buckets) for (const geos of bm.values()) {
    const mesh = new THREE.Mesh(mergeGeometries(geos), m);
    let off = 0;
    for (const g of geos) { const n = g.attributes.position.count; if (g.userData.brec) g.userData.brec.ranges.push({ mesh, start: off, count: n }); off += n; }
    geos.forEach(g => g.dispose());
    mesh.castShadow = mesh.receiveShadow = !m.transparent;
    root.add(mesh);
  }
  return root;
}

/* =====================================================================
   MODELLI: CASE
   ===================================================================== */
function addWindow(p, x, y, z, rotY, w, h, style) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = rotY; p.add(g);
  box(g, w + 0.26, h + 0.26, 0.1, M.frame, 0, -0.13, 0);
  box(g, w, h, 0.1, R() < 0.3 ? M.glassLit : M.glass, 0, 0, 0.02);
  if (style !== 'single') box(g, 0.08, h, 0.04, M.frame, 0, 0, 0.09);
  if (style === 'quad') box(g, w, 0.08, 0.04, M.frame, 0, h * 0.55, 0.09);
  box(g, w + 0.45, 0.1, 0.22, M.trim, 0, -0.26, 0.08);
}
function addDoor(p, x, y, z, rotY, spot = true) {
  const w = 1.25, h = 2.1;
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = rotY; p.add(g);
  box(g, w + 0.3, h + 0.15, 0.1, M.frame, 0, 0, 0);
  box(g, w, h, 0.1, M.glass, 0, 0, 0.02);
  box(g, 0.07, h, 0.04, M.frame, 0, 0, 0.09);
  box(g, w + 0.9, 0.12, 0.8, M.trim, 0, h + 0.25, 0.35);
  if (spot && DOOR_TAG) { const m = new THREE.Object3D(); m.position.set(0, 0, 0.15); m.userData.door = DOOR_TAG; g.add(m); }   // ingresso visitabile
}
function addAC(p, x, y, z, rot) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = rot; p.add(g);
  box(g, 1.0, 0.55, 0.7, M.trim, 0, 0, 0);
  cyl(g, 0.22, 0.22, 0.05, M.dark, -0.22, 0.55, 0, 12);
  cyl(g, 0.22, 0.22, 0.05, M.dark, 0.25, 0.55, 0, 12);
}
function addHatch(p, x, y, z) {
  box(p, 1.3, 0.18, 1.0, M.trim, x, y, z);
  box(p, 1.0, 0.02, 0.7, M.roofIn, x, y + 0.18, z);
}
function addWaterTower(p, x, y, z) {
  const g = new THREE.Group(); g.position.set(x, y, z); p.add(g);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(g, 0.12, 1.6, 0.12, M.dark, sx * 0.55, 0, sz * 0.55);
  box(g, 1.2, 0.08, 0.08, M.dark, 0, 0.8, 0.55); box(g, 1.2, 0.08, 0.08, M.dark, 0, 0.8, -0.55);
  box(g, 0.08, 0.08, 1.2, M.dark, 0.55, 0.8, 0); box(g, 0.08, 0.08, 1.2, M.dark, -0.55, 0.8, 0);
  cyl(g, 0.9, 0.9, 0.1, M.dark, 0, 1.6, 0, 10);
  cyl(g, 0.75, 0.75, 1.4, M.tank, 0, 1.7, 0, 14);
  cyl(g, 0.77, 0.77, 0.07, M.tankBand, 0, 2.0, 0, 14);
  cyl(g, 0.77, 0.77, 0.07, M.tankBand, 0, 2.7, 0, 14);
  cyl(g, 0.05, 0.92, 0.65, M.tankRoof, 0, 3.1, 0, 8);
}

const PALETTES = [
  ['#4fd0b8'], ['#4fd0b8', '#e9d68f'], ['#f2a7a0'], ['#8cc8ee'], ['#f5c37c'], ['#b7a7e8'],
  ['#e9d68f'], ['#f08e7a', '#f4ead9'], ['#8fd6a1'], ['#f4ead9', '#8cc8ee'], ['#f2a7a0', '#f4ead9'],
];
function randomBuildingOpts() {
  const floors = pick([1, 2, 2, 2, 3, 3, 4]);
  const porch = floors >= 2 && R() < 0.25;
  return {
    floors, porch, colors: pick(PALETTES),
    w: rand(6, 8), d: porch ? rand(5.4, 6) : rand(6, 8),
    shop: !porch && R() < 0.35, winStyle: pick(['double', 'quad', 'single', 'double']),
  };
}

/* Edificio: fronte (porta) verso +z locale */
function createBuilding(o) {
  const g = new THREE.Group();
  const { w, d, floors, colors, porch, shop, winStyle } = o;
  const FH = 2.8, PL = 0.35, PD = 2.3, blank = floors >= 2 && R() < 0.4 ? (R() < 0.5 ? 1 : 3) : -1;
  box(g, w + 0.4, PL, d + 0.4, M.trim, 0, 0, 0); // zoccolo
  let y = PL;
  for (let f = 0; f < floors; f++) {
    box(g, w, FH, d, wallMat(colors[Math.min(f, colors.length - 1)]), 0, y, 0);
    for (let face = 0; face < 4; face++) {
      if (face === blank) continue;
      if (face !== 0 && f > 0 && R() < 0.12) continue;
      const len = face % 2 === 0 ? w : d, half = face % 2 === 0 ? d / 2 : w / 2;
      const th = face * Math.PI / 2, nx = Math.sin(th), nz = Math.cos(th), tx = Math.cos(th), tz = -Math.sin(th);
      const n = Math.max(1, Math.floor((len - 0.6) / 2.1));
      for (let k = 0; k < n; k++) {
        const off = (k + 0.5) * len / n - len / 2;
        const px = nx * half + tx * off, pz = nz * half + tz * off;
        if (f === 0 && face === 0 && k === Math.floor(n / 2)) addDoor(g, px, y, pz, th);
        else if (f === 0 && face === 0 && shop) addWindow(g, px, y + 0.45, pz, th, len / n - 0.55, 1.9, 'single');
        else addWindow(g, px, y + 0.8, pz, th, 1.1, 1.4, winStyle);
      }
    }
    if (f < floors - 1) box(g, w + 0.24, 0.22, d + 0.24, M.trim, 0, y + FH - 0.11, 0); // marcapiano
    y += FH;
  }
  if (blank > 0) { const th = blank * Math.PI / 2, hh = floors * FH, aw = Math.min(d - 1.0, 6.4), ah = Math.min(hh - 1.3, aw * 0.6); addWallAd(g, Math.sin(th) * (w / 2 + 0.07), PL + (hh - ah) / 2, 0, th, aw, ah, Math.floor(R() * AD_DESIGNS.length)); }
  // tetto piano con parapetto
  box(g, w + 0.5, 0.28, d + 0.5, M.roof, 0, y, 0);
  const ry = y + 0.28, W5 = w + 0.5, D5 = d + 0.5;
  box(g, W5, 0.4, 0.22, M.roof, 0, ry, D5 / 2 - 0.11);
  box(g, W5, 0.4, 0.22, M.roof, 0, ry, -D5 / 2 + 0.11);
  box(g, 0.22, 0.4, d + 0.06, M.roof, W5 / 2 - 0.11, ry, 0);
  box(g, 0.22, 0.4, d + 0.06, M.roof, -W5 / 2 + 0.11, ry, 0);
  box(g, w + 0.06, 0.02, d + 0.06, M.roofIn, 0, ry, 0);
  // oggetti sul tetto
  const slots = [[-w / 4, -d / 4], [w / 4, -d / 4], [-w / 4, d / 4], [w / 4, d / 4]].sort(() => R() - 0.5);
  let si = 0;

function createPoliceStation() {
  const g = new THREE.Group();

    for (let face = 0; face < 4; face++) {
      const len = face % 2 === 0 ? w : d, half = face % 2 === 0 ? d / 2 : w / 2, th = face * Math.PI / 2;
      const nx = Math.sin(th), nz = Math.cos(th), tx = Math.cos(th), tz = -Math.sin(th);

        const off = (k + 0.5) * len / n - len / 2;
        if (f === 0 && face === 0 && Math.abs(off) < 1.8) continue;
        addWindow(g, nx * half + tx * off, y + 0.75, nz * half + tz * off, th, 1.1, 1.4, 'double');

    }
    box(g, w + 0.08, 0.42, d + 0.08, M.polBlue, 0, y + FH - 0.42, 0); // fascia blu

  }

  for (const sx of [-2, 2]) box(g, 0.2, 2.7, 0.2, M.trim, sx, PL, fz + 1.9);

  box(g, w + 0.5, 0.28, d + 0.5, M.roof, 0, y, 0);
  const ry = y + 0.28, W5 = w + 0.5, D5 = d + 0.5;
  box(g, W5, 0.4, 0.22, M.roof, 0, ry, D5 / 2 - 0.11);

  const s2 = new THREE.Mesh(new THREE.PlaneGeometry(5.0, 0.8), SIGN_POLIZIA); s2.position.set(0, ry + 0.5, D5 / 2 - 0.4); g.add(s2);

   ===================================================================== */
const lodObjects = new Set();
let lodFar = true;
function withLOD(build) {
  const near = build(true), far = build(false);          // vicino: alta definizione, lontano: versione leggera
  far.traverse(o => { o.userData.dynamic = false; });
  bake(far);
  const root = new THREE.Group(); root.add(near, far);
  root.userData = { ...near.userData, lod: { near, far } };
  near.visible = !lodFar; far.visible = lodFar;
  lodObjects.add(root.userData.lod);
  return root;
}
function setLOD(far) {
  if (far === lodFar) return;
  lodFar = far;
  for (const l of lodObjects) { l.near.visible = !far; l.far.visible = far; }
}

  for (let z = 54.5; z < 72; z += 2.5) box(root, 0.25, 0.55, 0.9, M.rubber, 23.95, -0.45, z);
  for (let x = 25.5; x < qx1; x += 2.5) box(root, 0.9, 0.55, 0.25, M.rubber, x, -0.45, 72.05);

  addCrane(root, 36, 66); addCrane(root, 66, 66);

  for (let x = -80; x <= 80; x += 8) { box(root, 1.4, 0.4, 1.4, M.trim, x, 0.3, 49); box(root, 1.2, 0.02, 1.2, mat('#7a5a3a'), x, 0.7, 49); addPalm(root, x, 0.7, 49, rand(0.85, 1.05)); }
  for (let x = -76; x <= 76; x += 8) {

  }
  for (let x = -78; x <= 78; x += 12) addLamp(root, x, 52.6, 0, -1);
  // spiaggia: ombrelloni, lettini, sdraio, teli, surf
  for (let x = -83; x <= -14; x += 6.2) for (const row of [0, 1]) {

    if (k < 0.5) { addLounger(root, ux - 0.55, z + 0.3); addLounger(root, ux + 0.55, z + 0.3); beachSpots.push({ x: ux - 0.55, z: z + 0.3, t: 'lounger' }, { x: ux + 0.55, z: z + 0.3, t: 'lounger' }); }
    else if (k < 0.8) { addDeckChair(root, ux - 0.5, z + 0.5, pick(UCOL)); addDeckChair(root, ux + 0.5, z + 0.5, pick(UCOL)); beachSpots.push({ x: ux + 1.4, z: z + 0.6, t: 'stand' }); }

   ===================================================================== */
function makePoly(pts) {
  const cum = [0];
  for (let k = 1; k < pts.length; k++) cum.push(cum[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
  return { pts, cum, len: cum[cum.length - 1] };
}
function samplePoly(p, s) {
  const c = p.cum; let k = 1;
  while (k < c.length - 1 && c[k] < s) k++;
  const a = p.pts[k - 1], b = p.pts[k], L = c[k] - c[k - 1] || 1;
  const t = Math.min(1, Math.max(0, (s - c[k - 1]) / L));
  return { x: a[0] + (b[0] - a[0]) * t, z: a[1] + (b[1] - a[1]) * t, dx: (b[0] - a[0]) / L, dz: (b[1] - a[1]) / L };
}
const rectLoop = (cx, cz, rx, rz) => makePoly([[cx - rx, cz - rz], [cx + rx, cz - rz], [cx + rx, cz + rz], [cx - rx, cz + rz], [cx - rx, cz - rz]]);

function updatePerson(p, dt, t) {
  const m = p.mesh;
  let moving = false;
  if (p.mode === 'knocked') {                         // travolto: vola, cade, resta a terra e si rialza
    if (updateKnocked(p, dt, false)) {
      const prev = p.knock.prev; p.mode = prev; m.rotation.x = 0; p.knock = null;
      if (prev === 'walk') { const q = samplePoly(p.path, p.s); p.koff = { x: p.x - q.x, z: p.z - q.z }; }
    }
    return;
  }
  if (p.mode === 'walk') {
    const slow = p.slow === undefined ? 1 : p.slow;
    if (p.pause > 0) p.pause -= dt;
    else {
      p.s = ((p.s + p.dir * p.speed * slow * dt) % p.path.len + p.path.len) % p.path.len;
      moving = slow > 0.08;
      if (Math.random() < dt * 0.025) p.pause = 1.5 + Math.random() * 3;
    }
    const q = samplePoly(p.path, p.s), tx = q.dx * p.dir, tz = q.dz * p.dir;
    p.lat = (p.lat || 0) + ((p.latT || 0) - (p.lat || 0)) * Math.min(1, dt * 2.5);   // si sposta di lato per non urtare
    p.x = q.x - tz * p.lat; p.z = q.z + tx * p.lat;
    if (p.koff) { p.x += p.koff.x; p.z += p.koff.z; const f = Math.exp(-1.2 * dt); p.koff.x *= f; p.koff.z *= f; if (Math.abs(p.koff.x) + Math.abs(p.koff.z) < 0.02) p.koff = null; }
    p.ang = lerpAngle(p.ang, Math.atan2(q.dx * p.dir, q.dz * p.dir), 1 - Math.exp(-8 * dt));
    m.position.set(p.x, p.y, p.z); m.rotation.y = p.ang;
  } else if (p.mode === 'roam') {             // calciatori: corrono verso un punto o verso il pallone
    const ball = life.ball;
    let tx = p.tx, tz = p.tz;
    if (ball && ball.target === p) { tx = ball.x; tz = ball.z; }
    else if (tx === undefined || Math.hypot(tx - p.x, tz - p.z) < 0.4) {
      const [x0, x1, z0, z1] = p.box;
      p.tx = tx = x0 + Math.random() * (x1 - x0); p.tz = tz = z0 + Math.random() * (z1 - z0);
    }
    const dx = tx - p.x, dz = tz - p.z, d = Math.hypot(dx, dz);
    if (d > 0.3) {
      const v = Math.min(d, p.speed * dt); p.x += dx / d * v; p.z += dz / d * v; moving = true;
      p.ang = lerpAngle(p.ang, Math.atan2(dx, dz), 1 - Math.exp(-8 * dt));
    }
    m.position.set(p.x, p.y, p.z); m.rotation.y = p.ang;
  } else if (p.mode === 'tennis') {           // tennisti: si spostano lungo la linea di fondo
    if (p.tz !== undefined) { const dz = p.tz - p.z; if (Math.abs(dz) > 0.05) { p.z += Math.sign(dz) * Math.min(Math.abs(dz), 3.2 * dt); moving = true; } }
    if (p.hit > 0) p.hit -= dt;
    m.position.set(p.x, p.y, p.z); m.rotation.y = p.ang;
  }
  p.swing += ((moving ? 1 : 0) - p.swing) * Math.min(1, dt * 6);
  if (moving) p.phase += dt * p.speed * 5.2 / p.sc;
  // non serve animare gli arti quando la persona è mostrata come mesh statica (vista da lontano)
  if (lodFar && p.mesh.userData.lod) return;
  const [lL, lR] = p.legs, [aL, aR] = p.arms, [kL, kR] = p.knees, [eL, eR] = p.elbows;
  kL.rotation.x = kR.rotation.x = 0; eL.rotation.x = eR.rotation.x = -0.12;
  if (p.mode === 'walk' || p.mode === 'idle' || p.mode === 'roam' || p.mode === 'tennis') {
    const s = Math.sin(p.phase), c = Math.cos(p.phase), sw = p.swing, br = Math.sin(t * 1.5 + p.phase) * 0.03 * (1 - sw);
    lL.rotation.x = -0.5 * s * sw; lR.rotation.x = 0.5 * s * sw;                  // anche
    kL.rotation.x = Math.max(0, c) * 0.95 * sw; kR.rotation.x = Math.max(0, -c) * 0.95 * sw;   // ginocchia in fase di slancio
    aL.rotation.x = 0.42 * s * sw; aR.rotation.x = -0.42 * s * sw * (p.item ? 0.3 : 1);
    eL.rotation.x = -0.12 - (0.2 + 0.3 * Math.max(0, -s)) * sw; eR.rotation.x = -0.12 - (0.2 + 0.3 * Math.max(0, s)) * sw * (p.item ? 0.3 : 1);
    aL.rotation.z = -0.05 - br; aR.rotation.z = 0.05 + br;
    m.position.y = p.y + Math.abs(c) * 0.045 * sw * p.sc;                         // leggero rimbalzo del passo
    if (p.mode === 'tennis') { aR.rotation.x = p.hit > 0 ? -2.2 * (p.hit / 0.3) : -0.5; eR.rotation.x = -0.4; }
  } else if (p.mode === 'direct') {           // vigile che dirige il traffico
    aR.rotation.set(0, 0, Math.PI * 0.5); eR.rotation.x = 0;
    aL.rotation.set(-1.3 + Math.sin(t * 3.2 + p.phase) * 0.45, 0, -0.2); eL.rotation.x = -0.6 + Math.sin(t * 3.2 + p.phase) * 0.4;
    m.rotation.y = p.ang + Math.sin(t * 0.4 + p.phase) * 0.6;
  } else if (p.mode === 'swim') {
    aL.rotation.x = t * 3 + p.phase; aR.rotation.x = t * 3 + p.phase + Math.PI;
    lL.rotation.x = Math.sin(t * 6) * 0.3; lR.rotation.x = -Math.sin(t * 6) * 0.3;
    m.position.y = p.y + Math.sin(t * 2 + p.phase) * 0.06;
  } else if (p.mode === 'sit') {
    lL.rotation.x = lR.rotation.x = -1.5; kL.rotation.x = kR.rotation.x = 1.45;
    aL.rotation.x = aR.rotation.x = -0.35; eL.rotation.x = eR.rotation.x = -0.8;
  }
}
function updateDog(d, dt, t) {
  const o = d.owner, fx = Math.sin(o.ang), fz = Math.cos(o.ang), rx = -fz, rz = fx;
  const k = d.init ? Math.min(1, dt * 6) : 1; d.init = true;
  d.x +=(o.x + fx * 0.9 + rx * 0.5 - d.x) * k; d.z += (o.z + fz * 0.9 + rz * 0.5 - d.z) * k;
  d.mesh.position.set(d.x, o.y, d.z);
  d.mesh.rotation.y = lerpAngle(d.mesh.rotation.y, o.ang, k);
  const sw = Math.sin(o.phase * 1.6) * o.swing * 0.7;
  d.legs[0].rotation.x = d.legs[3].rotation.x = sw; d.legs[1].rotation.x = d.legs[2].rotation.x = -sw;
  d.tail.rotation.z = Math.sin(t * 10) * 0.45;
  const a = d.leash.geometry.attributes.position, hs = 0.3 * o.sc;
  a.setXYZ(0, o.x + rx * hs, o.y + 0.7 * o.sc / 0.85, o.z + rz * hs);
  a.setXYZ(1, d.x + fx * 0.28, o.y + 0.5, d.z + fz * 0.28);
  a.needsUpdate = true;
}
function updateLife(dt, t) {
  crowdStep(dt);
  for (const p of life.people) updatePerson(p, dt, t);
  for (const d of life.dogs) updateDog(d, dt, t);
  for (const c of life.cats) c.tail.rotation.y = Math.sin(t * 1.4 + c.ph) * 0.6;
  for (const b of life.pigeons) {
    b.head.rotation.x = Math.max(0, Math.sin(t * 3 + b.ph)) * 0.9;
    if (Math.random() < dt * 0.3) b.mesh.rotation.y += (Math.random() - 0.5) * 2;
  }
  for (const g of life.gulls) {
    g.t += dt * g.w;
    const x = g.cx + g.r * Math.cos(g.t), z = g.cz + g.r * Math.sin(g.t);
    const dx = -Math.sin(g.t) * g.w, dz = Math.cos(g.t) * g.w;
    g.mesh.position.set(x, g.h + Math.sin(t * 0.8 + g.ph) * 0.6, z);
    g.mesh.rotation.y = Math.atan2(dx, dz); g.mesh.rotation.z = -Math.sign(g.w) * 0.35;
    const glide = Math.sin(t * 0.6 + g.ph) > 0.3 ? 0.12 : 1;
    const f = Math.sin(t * 9 + g.ph) * 0.6 * glide;
    g.wings[0].rotation.z = -f; g.wings[1].rotation.z = f;
  }
  for (const b of life.boats) {
    const m = b.mesh;
    if (b.moving && b.path) {
      b.s = (b.s + b.speed * dt) % b.path.len;
      const q = samplePoly(b.path, b.s);
      b.x = q.x; b.z = q.z; m.position.x = b.x; m.position.z = b.z;
      m.rotation.y = lerpAngle(m.rotation.y, Math.atan2(-q.dz, q.dx), 1 - Math.exp(-4 * dt));
    } else if (b.moving) {
      b.t += dt * b.w;
      b.x = b.cx + b.rx * Math.cos(b.t); b.z = b.cz + b.rz * Math.sin(b.t);
      const dx = -b.rx * Math.sin(b.t) * b.w, dz = b.rz * Math.cos(b.t) * b.w;
      m.position.x = b.x; m.position.z = b.z;
      m.rotation.y = Math.atan2(-dz, dx);
      m.rotation.x = Math.sign(b.w) * 0.08;
      m.rotation.z = 0.04;
    } else m.rotation.x = Math.sin(t * 0.9 + b.ph) * 0.02 * b.amp;
    m.position.y = b.y + Math.sin(t * 1.3 + b.ph) * 0.05 * b.amp;
  }
  life.lhBeam.rotation.y += dt * 0.8;
  if (life.tennis) {                          // scambio a tennis: la pallina fa un arco da un giocatore all'altro
    const T = life.tennis;
    T.t += dt / 1.3;
    if (T.t >= 1) {
      T.t = 0; [T.from, T.to] = [T.to, T.from];
      T.z0 = T.z1; T.z1 = T.sz + (Math.random() * 2 - 1) * 2.2; T.to.tz = T.z1; T.from.hit = 0.3;
    }
    const dir = Math.sign(T.to.x - T.from.x), xa = T.from.x + dir * 0.6, xb = T.to.x - dir * 0.6;
    T.ball.position.set(xa + (xb - xa) * T.t, 0.9 + Math.sin(Math.PI * T.t) * 1.6, T.z0 + (T.z1 - T.z0) * T.t);
  }
  if (life.ball) {                            // il pallone passa da un giocatore all'altro
    const b = life.ball, tp = b.target, dx = tp.x - b.x, dz = tp.z - b.z, d = Math.hypot(dx, dz);
    if (d < 0.5) b.target = b.players[Math.floor(Math.random() * b.players.length)];
    else { const v = Math.min(d, 9 * dt); b.x += dx / d * v; b.z += dz / d * v; }
    b.mesh.position.set(b.x, 0.58 + Math.abs(Math.sin(t * 5)) * 0.3, b.z);
  }
}

}

function perimeterWall(p, x0, z0, x1, z1, gates = []) {   // muro a pannelli, gates = [[x|z centro, lato 'n|s|e|w', larghezza]]

    }
  }
}

/* ---------- guscio della stanza: pavimento, muri con finestre e porta, tramezzi ---------- */
const WALL_H = 3.0, WALL_T = 0.2;
let lastDoorPivot = null;
/* muro lungo "a" (asse x se alongX) con aperture [{c, w, y0, y1, kind}] */
function wallRun(p, alongX, fixed, a0, a1, m, opens = [], curtains = null) {
  const segs = [], H = WALL_H, t = WALL_T;
  const B = (a, b, y0, y1) => { if (b - a < 0.01 || y1 - y0 < 0.01) return; const c = (a + b) / 2, len = b - a; alongX ? box(p, len, y1 - y0, t, m, c, y0, fixed) : box(p, t, y1 - y0, len, m, fixed, y0, c); };
  let cur = a0;
  for (const o of opens.slice().sort((a, b) => a.c - b.c)) {
    const s0 = o.c - o.w / 2, s1 = o.c + o.w / 2;
    B(cur, s0, 0, H); B(s0, s1, 0, o.y0); B(s0, s1, o.y1, H); cur = s1;
    const inner = fixed + (alongX ? 1 : 1) * (t / 2 + 0.02) * (fixed < 0 ? 1 : -1);
    const P = (aa, y, w, h, d, mm) => alongX ? box(p, w, h, d, mm, aa, y, inner) : box(p, d, h, w, mm, inner, y, aa);
    if (o.kind === 'window') {
      P(o.c, o.y0, o.w, o.y1 - o.y0, 0.04, IMAT.window);
      P(o.c, o.y0 - 0.06, o.w + 0.16, 0.06, 0.16, M.white);
      for (const e of [-1, 1]) P(o.c + e * o.w / 2, o.y0, 0.08, o.y1 - o.y0, 0.1, M.white);
      P(o.c, o.y1, o.w + 0.08, 0.08, 0.1, M.white); P(o.c, o.y0, 0.06, o.y1 - o.y0, 0.08, M.white); P(o.c, (o.y0 + o.y1) / 2, o.w, 0.06, 0.08, M.white);
      if (curtains) {
        const cm = TM(curtains, 'carpet');
        P(o.c, o.y1 + 0.15, o.w + 0.9, 0.04, 0.04, M.dark);
        for (const e of [-1, 1]) for (let k = 0; k < 3; k++) P(o.c + e * (o.w / 2 + 0.12 + k * 0.1), 0.05, 0.1, o.y1 + 0.1, 0.12 + (k % 2) * 0.05, cm);
      }
    } else if (o.kind === 'door') {
      for (const e of [-1, 1]) P(o.c + e * (o.w / 2 + 0.04), 0, 0.08, o.y1 + 0.08, 0.1, M.white);
      P(o.c, o.y1, o.w + 0.16, 0.08, 0.1, M.white);
      const piv = new THREE.Group(); piv.userData.dynamic = true;                 // anta incernierata (si apre verso la stanza)
      if (alongX) piv.position.set(o.c - o.w / 2, 0.02, inner); else piv.position.set(inner, 0.02, o.c - o.w / 2);
      p.add(piv);
      const dm = TM('#5a3a2a', 'wood'), hm = mat('#c9ccd3', { metalness: 0.6 }), L = o.w - 0.04;
      if (alongX) { box(piv, L, o.y1 - 0.04, 0.06, dm, L / 2, 0, 0); box(piv, 0.05, 0.05, 0.14, hm, L - 0.12, 1.0, 0); }
      else { box(piv, 0.06, o.y1 - 0.04, L, dm, 0, 0, L / 2); box(piv, 0.14, 0.05, 0.05, hm, 0, 1.0, L - 0.12); }
      lastDoorPivot = piv;
    }
  }
  B(cur, a1, 0, H);
  // coronamento bianco
  alongX ? box(p, a1 - a0 + t, 0.08, t + 0.06, M.white, (a0 + a1) / 2, H, fixed) : box(p, t + 0.06, 0.08, a1 - a0 + t, M.white, fixed, H, (a0 + a1) / 2);
}
function roomShell(root, R, o) {
  const W = R.W, D = R.D;

  box(root, W, 0.02, D, o.floor, 0, -0.02, 0);
  wallRun(root, true, -D / 2 - WALL_T / 2, -W / 2 - WALL_T, W / 2, o.wallZ, o.winZ.map(c => ({ c, w: 1.4, y0: 0.9, y1: 2.4, kind: 'window' })), o.curtains);
  const xo = o.winX.map(c => ({ c, w: 1.4, y0: 0.9, y1: 2.4, kind: 'window' }));
  if (!o.noDoor) xo.push({ c: R.exitZ, w: 1.1, y0: 0, y1: 2.2, kind: 'door' });

function updateCars(dt) {
  const obs = obstaclesForAI();
  for (const a of cars) {
    a.gap = Infinity;
    if (a.ghost > 0) { a.ghost -= dt; continue; }
    for (const b of cars) {
      if (a === b) continue;
      const g = gapTo(a, b);
      if (g < a.gap) {
        if (gapTo(b, a) < Infinity && a.id < b.id) continue; // blocco reciproco: passa l'id minore
        a.gap = g;
      }
    }
    for (const b of obs) { const g = gapTo(a, b); if (g < a.gap) a.gap = g; }
  }
  for (const c of cars) {
    const p = c.path;
    let vmax = p.turn ? Math.min(c.maxV, V_TURN) : c.maxV;
    const remaining = p.len - c.s;
    if (!p.turn && c.nextPath.turn) vmax = Math.min(vmax, Math.sqrt(V_TURN * V_TURN + 2 * DECEL * 0.6 * remaining));
    // semaforo
    let atRed = false;
    if (c.nextTile.inter && !p.turn) {
      const stopS = p.len - (STOP_FROM_END - 1.75 + c.len / 2);
      if (c.s <= stopS + 0.05) {
        const st = lightState(c.nextTile, c.dout % 2), gap = stopS - c.s;

    else c.stuck = 0;

    const ds = c.v * dt;
    c.s += ds;
    while (c.s >= c.path.len) { c.s -= c.path.len; advanceTile(c); }
    const q = samplePath(c.path, c.s);
    c.x = q.x; c.z = q.z;
    c.ang = lerpAngle(c.ang, q.ang, 1 - Math.exp(-18 * dt));
    c.mesh.position.set(c.x, bumpHeight(c.x, c.z), c.z);
    c.mesh.rotation.y = c.ang;
    for (const w of c.wheels) w.rotation.z -= ds / 0.34;
    if (c.mesh.userData.drum) c.mesh.userData.drum.rotation.x += dt * 1.5;
  }
}

{
