<!doctype html>
<html lang="it">

<style>

  #ui h1{font-size:15px;margin:0 0 10px;letter-spacing:.3px}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   COSTANTI
   ===================================================================== */
const TILE = 10, HALF = 5;
const NX = 17, NZ = 13;                       // griglia 17x13 tile da 10 unità → 4x3 isolati
const OZ = 45 - NZ * TILE / 2;                // il bordo sud della città resta a z=45 (lungomare)
const XW = NX * TILE / 2 + 1.5;               // mezza larghezza del plastico
const SIDEWALK = 1.5, SW_H = 0.3, LANE = 1.75; // marciapiede, altezza, offset corsia
const H2 = HALF - SIDEWALK / 2;
const CURB_IN = HALF - SIDEWALK + 0.38;          // pali/lampioni vicino al cordolo, lasciando spazio ai pedoni
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // N E S O  (x, z)
const isRoadIdx = (i, j) => i >= 0 && j >= 0 && i < NX && j < NZ && (i % 4 === 0 || j % 4 === 0);

/* RNG con seme, per città riproducibili */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = mulberry32(7);
const rand = (a, b) => a + (b - a) * R();
const pick = arr => arr[Math.floor(R() * arr.length)];
const mpick = arr => arr[Math.floor(Math.random() * arr.length)];

/* =====================================================================
   MATERIALI
   ===================================================================== */
const matCache = new Map();
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, ...opts }));
  return matCache.get(key);
}
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = glowTexture();
const CYCLE = 22;   // ciclo semaforico (s)
const LIGHT_MATS = [0, 1].map(() => {
  const mk = c => { const m = new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0, roughness: 0.4 }); m.userData.base = m.color.getHex(); return m; };
  return { r: mk('#ff3b30'), y: mk('#ffc928'), g: mk('#3ddc6a') };
});
const M = {
  asphalt: mat('#78737f'), pave: mat('#e3e3e8'), pave2: mat('#d6d6dc'), curb: mat('#f5f5f7'), line: mat('#f7f7f7'),
  baseSide: mat('#c3c4cc'), trim: mat('#e9e9ed'), roof: mat('#f2f2f4'), roofIn: mat('#d8d8de'), frame: mat('#f8f8f8'),
  glass: mat('#a6d8f0', { roughness: 0.25 }),
  glassLit: new THREE.MeshStandardMaterial({ color: '#a6d8f0', roughness: 0.25, emissive: '#ffcf7a', emissiveIntensity: 0 }),
  dark: mat('#41444c'), pole: mat('#8d929c'), tire: mat('#2c2d33'), hub: mat('#d5d7dc'), bumper: mat('#d9dade'),
  headlight: new THREE.MeshStandardMaterial({ color: '#fff8e0', emissive: '#fff2c0', emissiveIntensity: 0.2 }),
  tail: new THREE.MeshStandardMaterial({ color: '#e8423a', emissive: '#ff2a1a', emissiveIntensity: 0.15 }),
  lamp: new THREE.MeshStandardMaterial({ color: '#fff6d0', emissive: '#ffe39a', emissiveIntensity: 0.25 }),
  hydrant: mat('#d83a2e'), signBlue: mat('#3f7fe0'), grass: mat('#9bd37f'), water: mat('#7cc7ec', { roughness: 0.2 }),
  leaf: mat('#6cc06a', { flatShading: true }), leaf2: mat('#4fae63', { flatShading: true }), trunk: mat('#9a7356'),
  tank: mat('#dcc58a'), tankBand: mat('#b89e62'), tankRoof: mat('#f0cf5a'), wood: mat('#c79a6b'),
  glow: new THREE.MeshBasicMaterial({ map: glowTex, color: '#ffd68a', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }),
  beam: new THREE.MeshBasicMaterial({ map: glowTex, color: '#fff1c8', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }),
  // mare, spiaggia, porto
  sand: mat('#f0d9a0'), sandWet: mat('#e2c587'),
  sea: Object.assign(new THREE.MeshStandardMaterial({ color: '#79cdef', roughness: 0.12, metalness: 0.05 }), { userData: { keep: true } }),
  foam: new THREE.MeshBasicMaterial({ map: glowTex, color: '#ffffff', transparent: true, opacity: 0.6, depthWrite: false }),
  lhBeam: new THREE.MeshBasicMaterial({ map: glowTex, color: '#fff2b0', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }),
  plank: mat('#c9a57a'), plankDark: mat('#9c7a55'), concrete: mat('#d0d2d9'), rubber: mat('#2b2c31'),
  hullW: mat('#f7f8fa'), hullB: mat('#2c58bd'), hullR: mat('#d63b3b'), deck: mat('#dcb98a'), navy: mat('#24365e'),
  glassDark: mat('#34465f', { roughness: 0.2 }), pool: mat('#62cbf0', { roughness: 0.15 }), deckGreen: mat('#73c36e'),
  lifeboat: mat('#f39a2c'), sailRed: mat('#d9483a', { side: THREE.DoubleSide }), sailW: mat('#fafafa', { side: THREE.DoubleSide }),
  craneY: mat('#f2c230'), craneR: mat('#e0533c'),
  lightHouse: new THREE.MeshStandardMaterial({ color: '#fff6d0', emissive: '#ffe08a', emissiveIntensity: 0.3 }),
  // polizia e persone
  polBlue: mat('#2453b0'), polNavy: mat('#1e2a47'), gold: mat('#f0c232', { metalness: 0.3, roughness: 0.4 }), shoe: mat('#1b1c20'),
  sirenR: new THREE.MeshStandardMaterial({ color: '#ff3b30', emissive: '#ff2015', emissiveIntensity: 0.2 }),
  sirenB: new THREE.MeshStandardMaterial({ color: '#2f6bff', emissive: '#1f5bff', emissiveIntensity: 0.2 }),
};

/* =====================================================================
   HELPER GEOMETRIE  (y = base dell'oggetto)
   ===================================================================== */
function box(p, w, h, d, m, x = 0, y = 0, z = 0) {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y + h / 2, z); p.add(o); return o;
}
function rbox(p, w, h, d, r, m, x = 0, y = 0, z = 0) {
  const o = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, r), m); o.position.set(x, y + h / 2, z); p.add(o); return o;
}
function cyl(p, rt, rb, h, m, x = 0, y = 0, z = 0, seg = 12) {
  const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m); o.position.set(x, y + h / 2, z); p.add(o); return o;
}
// box in un sistema locale al tile: "along" verso il lato s, "lat" verso il lato s+1
function pbox(p, cx, cz, s, along, lat, lenA, lenL, h, m, y = 0) {
  const [ax, az] = DIRS[s], [lx, lz] = DIRS[(s + 1) % 4];
  const x = cx + ax * along + lx * lat, z = cz + az * along + lz * lat;
  return ax !== 0 ? box(p, lenA, h, lenL, m, x, y, z) : box(p, lenL, h, lenA, m, x, y, z);
}
function fr(cx, cz, s, along, lat) {
  const [ax, az] = DIRS[s], [lx, lz] = DIRS[(s + 1) % 4];
  return [cx + ax * along + lx * lat, cz + az * along + lz * lat];
}

/* Unisce tutte le mesh statiche di un gruppo → pochissime draw call.
   I materiali "semplici" finiscono in un'unica mesh con i colori nei vertici (VC_MAT);
   quelli speciali (emissivi, trasparenti, con texture, animati) restano separati per materiale. */
const VC_MAT = new THREE.MeshLambertMaterial({ vertexColors: true });
const vcMergeable = m => m.isMeshStandardMaterial && !m.vertexColors && !m.map && !m.transparent && m.side === THREE.FrontSide
  && m.emissive.getHex() === 0 && !m.userData.keep;
function bake(root) {
  root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
  const buckets = new Map(), remove = [];
  root.traverse(o => {
    if (!o.isMesh) return;
    for (let p = o; p && p !== root; p = p.parent) if (p.userData.dynamic) return;
    const geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    for (const k of Object.keys(geo.attributes)) if (!['position', 'normal', 'uv', 'color'].includes(k)) geo.deleteAttribute(k);
    geo.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
    let key = o.material;
    if (o.material === VC_MAT) key = VC_MAT;          // già cotto in precedenza
    else if (vcMergeable(o.material)) {
      key = VC_MAT;
      if (o.material.flatShading) geo.computeVertexNormals();   // geometria non indicizzata → normali per faccia
      const c = o.material.color, n = geo.attributes.position.count, arr = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
      geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    } else if (geo.attributes.color) geo.deleteAttribute('color');
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(geo);
    o.geometry.dispose(); remove.push(o);
  });
  remove.forEach(o => o.parent.remove(o));
  for (const [m, geos] of buckets) {
    const mesh = new THREE.Mesh(mergeGeometries(geos), m);
    geos.forEach(g => g.dispose());
    mesh.castShadow = mesh.receiveShadow = !m.transparent;
    root.add(mesh);
  }
  return root;
}

/* =====================================================================
   MODELLI: CASE
   ===================================================================== */
function addWindow(p, x, y, z, rotY, w, h, style) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = rotY; p.add(g);
  box(g, w + 0.26, h + 0.26, 0.1, M.frame, 0, -0.13, 0);
  box(g, w, h, 0.1, R() < 0.3 ? M.glassLit : M.glass, 0, 0, 0.02);
  if (style !== 'single') box(g, 0.08, h, 0.04, M.frame, 0, 0, 0.09);
  if (style === 'quad') box(g, w, 0.08, 0.04, M.frame, 0, h * 0.55, 0.09);
  box(g, w + 0.45, 0.1, 0.22, M.trim, 0, -0.26, 0.08);
}
function addDoor(p, x, y, z, rotY) {
  const w = 1.25, h = 2.1;
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = rotY; p.add(g);
  box(g, w + 0.3, h + 0.15, 0.1, M.frame, 0, 0, 0);
  box(g, w, h, 0.1, M.glass, 0, 0, 0.02);
  box(g, 0.07, h, 0.04, M.frame, 0, 0, 0.09);
  box(g, w + 0.9, 0.12, 0.8, M.trim, 0, h + 0.25, 0.35);
}
function addAC(p, x, y, z, rot) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = rot; p.add(g);
  box(g, 1.0, 0.55, 0.7, M.trim, 0, 0, 0);
  cyl(g, 0.22, 0.22, 0.05, M.dark, -0.22, 0.55, 0, 12);
  cyl(g, 0.22, 0.22, 0.05, M.dark, 0.25, 0.55, 0, 12);
}
function addHatch(p, x, y, z) {
  box(p, 1.3, 0.18, 1.0, M.trim, x, y, z);
  box(p, 1.0, 0.02, 0.7, M.roofIn, x, y + 0.18, z);
}
function addWaterTower(p, x, y, z) {
  const g = new THREE.Group(); g.position.set(x, y, z); p.add(g);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(g, 0.12, 1.6, 0.12, M.dark, sx * 0.55, 0, sz * 0.55);
  box(g, 1.2, 0.08, 0.08, M.dark, 0, 0.8, 0.55); box(g, 1.2, 0.08, 0.08, M.dark, 0, 0.8, -0.55);
  box(g, 0.08, 0.08, 1.2, M.dark, 0.55, 0.8, 0); box(g, 0.08, 0.08, 1.2, M.dark, -0.55, 0.8, 0);
  cyl(g, 0.9, 0.9, 0.1, M.dark, 0, 1.6, 0, 10);
  cyl(g, 0.75, 0.75, 1.4, M.tank, 0, 1.7, 0, 14);
  cyl(g, 0.77, 0.77, 0.07, M.tankBand, 0, 2.0, 0, 14);
  cyl(g, 0.77, 0.77, 0.07, M.tankBand, 0, 2.7, 0, 14);
  cyl(g, 0.05, 0.92, 0.65, M.tankRoof, 0, 3.1, 0, 8);
}

const PALETTES = [
  ['#4fd0b8'], ['#4fd0b8', '#e9d68f'], ['#f2a7a0'], ['#8cc8ee'], ['#f5c37c'], ['#b7a7e8'],
  ['#e9d68f'], ['#f08e7a', '#f4ead9'], ['#8fd6a1'], ['#f4ead9', '#8cc8ee'], ['#f2a7a0', '#f4ead9'],
];
function randomBuildingOpts() {
  const floors = pick([1, 2, 2, 2, 3, 3, 4]);
  const porch = floors >= 2 && R() < 0.25;
  return {
    floors, porch, colors: pick(PALETTES),
    w: rand(6, 8), d: porch ? rand(5.4, 6) : rand(6, 8),
    shop: !porch && R() < 0.35, winStyle: pick(['double', 'quad', 'single', 'double']),
  };
}

/* Edificio: fronte (porta) verso +z locale */
function createBuilding(o) {
  const g = new THREE.Group();
  const { w, d, floors, colors, porch, shop, winStyle } = o;
  const FH = 2.8, PL = 0.35, PD = 2.3;
  box(g, w + 0.4, PL, d + 0.4, M.trim, 0, 0, 0); // zoccolo
  let y = PL;
  for (let f = 0; f < floors; f++) {
    box(g, w, FH, d, mat(colors[Math.min(f, colors.length - 1)]), 0, y, 0);
    for (let face = 0; face < 4; face++) {
      if (face !== 0 && f > 0 && R() < 0.12) continue;
      const len = face % 2 === 0 ? w : d, half = face % 2 === 0 ? d / 2 : w / 2;
      const th = face * Math.PI / 2, nx = Math.sin(th), nz = Math.cos(th), tx = Math.cos(th), tz = -Math.sin(th);
      const n = Math.max(1, Math.floor((len - 0.6) / 2.1));
      for (let k = 0; k < n; k++) {
        const off = (k + 0.5) * len / n - len / 2;
        const px = nx * half + tx * off, pz = nz * half + tz * off;
        if (f === 0 && face === 0 && k === Math.floor(n / 2)) addDoor(g, px, y, pz, th);
        else if (f === 0 && face === 0 && shop) addWindow(g, px, y + 0.45, pz, th, len / n - 0.55, 1.9, 'single');
        else addWindow(g, px, y + 0.8, pz, th, 1.1, 1.4, winStyle);
      }
    }
    if (f < floors - 1) box(g, w + 0.24, 0.22, d + 0.24, M.trim, 0, y + FH - 0.11, 0); // marcapiano
    y += FH;
  }
  // tetto piano con parapetto
  box(g, w + 0.5, 0.28, d + 0.5, M.roof, 0, y, 0);
  const ry = y + 0.28, W5 = w + 0.5, D5 = d + 0.5;
  box(g, W5, 0.4, 0.22, M.roof, 0, ry, D5 / 2 - 0.11);
  box(g, W5, 0.4, 0.22, M.roof, 0, ry, -D5 / 2 + 0.11);
  box(g, 0.22, 0.4, d + 0.06, M.roof, W5 / 2 - 0.11, ry, 0);
  box(g, 0.22, 0.4, d + 0.06, M.roof, -W5 / 2 + 0.11, ry, 0);
  box(g, w + 0.06, 0.02, d + 0.06, M.roofIn, 0, ry, 0);
  // oggetti sul tetto
  const slots = [[-w / 4, -d / 4], [w / 4, -d / 4], [-w / 4, d / 4], [w / 4, d / 4]].sort(() => R() - 0.5);
  let si = 0;
  if (floors >= 2 && R() < 0.35) { const [sx, sz] = slots[si++]; addWaterTower(g, sx, ry, sz); }
  if (R() < 0.7) { const [sx, sz] = slots[si++]; addHatch(g, sx, ry, sz); }
  const acs = 1 + Math.floor(R() * 2);
  for (let k = 0; k < acs && si < 4; k++) { const [sx, sz] = slots[si++]; addAC(g, sx, ry, sz, R() < 0.5 ? 0 : Math.PI / 2); }
  // portico
  let front = d / 2 + 0.2;
  if (porch) {
    box(g, w + 0.4, PL, PD, M.trim, 0, 0, d / 2 + 0.2 + PD / 2);
    box(g, w + 0.5, 0.3, PD + 0.3, M.roof, 0, PL + FH - 0.15, d / 2 + (PD + 0.3) / 2);
    for (const sx of [-1, 1]) box(g, 0.28, FH - 0.15, 0.28, M.trim, sx * (w / 2 + 0.02), PL, d / 2 + 0.2 + PD - 0.3);
    if (w > 7) box(g, 0.28, FH - 0.15, 0.28, M.trim, 0, PL, d / 2 + 0.2 + PD - 0.3);
    front += PD;
  }
  g.userData.front = front;
  return g;
}

/* =====================================================================
   MODELLI: ARREDO URBANO
   ===================================================================== */
function addTree(p, x, y, z, s = 1) {
  cyl(p, 0.12 * s, 0.17 * s, 1.1 * s, M.trunk, x, y, z, 6);
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(1.0 * s, 0), R() < 0.5 ? M.leaf : M.leaf2);
  m.position.set(x, y + 1.85 * s, z); m.rotation.set(R(), R() * 3, R()); m.scale.y = 1.15; p.add(m);
  if (R() < 0.5) {
    const m2 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.65 * s, 0), M.leaf);
    m2.position.set(x + 0.2 * s, y + 2.75 * s, z - 0.1 * s); p.add(m2);
  }
}
function addBench(p, x, y, z, rot) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = rot; p.add(g);
  box(g, 1.6, 0.1, 0.5, M.wood, 0, 0.42, 0);
  box(g, 1.6, 0.4, 0.08, M.wood, 0, 0.55, -0.22);
  for (const sx of [-0.65, 0.65]) box(g, 0.08, 0.42, 0.42, M.dark, sx, 0, 0);
}
function addLamp(p, x, z, faceX, faceZ) {
  const g = new THREE.Group(); g.position.set(x, SW_H, z); g.rotation.y = Math.atan2(faceX, faceZ); p.add(g);
  cyl(g, 0.15, 0.18, 0.25, M.pole, 0, 0, 0, 8);
  cyl(g, 0.07, 0.09, 4.6, M.pole, 0, 0, 0, 8);
  box(g, 0.08, 0.08, 1.45, M.pole, 0, 4.5, 0.65);
  rbox(g, 0.42, 0.18, 0.8, 0.06, M.pole, 0, 4.42, 1.4);
  box(g, 0.3, 0.04, 0.6, M.lamp, 0, 4.4, 1.4);
  // alone luminoso a terra (visibile di notte)
  const gl = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 4.2), M.glow);
  gl.rotation.x = -Math.PI / 2; gl.position.set(0, 0.04 - SW_H + 0.3, 1.7); g.add(gl);
}
function addHydrant(p, x, z) {
  cyl(p, 0.16, 0.18, 0.5, M.hydrant, x, SW_H, z, 10);
  const top = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), M.hydrant);
  top.position.set(x, SW_H + 0.5, z); p.add(top);
  box(p, 0.5, 0.1, 0.1, M.hydrant, x, SW_H + 0.3, z);
  box(p, 0.1, 0.1, 0.45, M.hydrant, x, SW_H + 0.3, z);
}
function addTrafficLight(p, x, z, faceDir, mats, sign) {

function textMaterial(text, bg, fg, w = 512, h = 112) {

function createPoliceStation() {
  const g = new THREE.Group();
  const w = 9.2, d = 6.8, FH = 2.9, PL = 0.35, wall = mat('#f2f4f8');
  box(g, w + 0.4, PL, d + 0.4, M.trim, 0, 0, 0);
  let y = PL;
  for (let f = 0; f < 2; f++) {
    box(g, w, FH, d, wall, 0, y, 0);
    for (let face = 0; face < 4; face++) {
      const len = face % 2 === 0 ? w : d, half = face % 2 === 0 ? d / 2 : w / 2, th = face * Math.PI / 2;
      const nx = Math.sin(th), nz = Math.cos(th), tx = Math.cos(th), tz = -Math.sin(th);
      const n = Math.max(1, Math.floor((len - 0.6) / 2.1));
      for (let k = 0; k < n; k++) {
        const off = (k + 0.5) * len / n - len / 2;
        if (f === 0 && face === 0 && Math.abs(off) < 1.8) continue;
        addWindow(g, nx * half + tx * off, y + 0.75, nz * half + tz * off, th, 1.1, 1.4, 'double');
      }
    }
    box(g, w + 0.08, 0.42, d + 0.08, M.polBlue, 0, y + FH - 0.42, 0); // fascia blu
    y += FH;
  }
  const fz = d / 2;
  // ingresso con pensilina e insegna
  box(g, 3.1, 2.45, 0.1, M.frame, 0, PL, fz);
  box(g, 2.8, 2.3, 0.1, M.glass, 0, PL, fz + 0.02);
  box(g, 0.08, 2.3, 0.04, M.frame, 0, PL, fz + 0.09);
  box(g, 4.4, 0.22, 2.1, M.polBlue, 0, PL + 2.7, fz + 1.05);
  box(g, 4.4, 0.55, 0.1, M.polBlue, 0, PL + 2.45, fz + 2.1);
  const s1 = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 0.45), SIGN_POLIZIA); s1.position.set(0, PL + 2.725, fz + 2.16); g.add(s1);
  for (const sx of [-2, 2]) box(g, 0.2, 2.7, 0.2, M.trim, sx, PL, fz + 1.9);
  box(g, 4.4, 0.15, 2.3, M.trim, 0, 0, fz + 1.15);
  // tetto
  box(g, w + 0.5, 0.28, d + 0.5, M.roof, 0, y, 0);
  const ry = y + 0.28, W5 = w + 0.5, D5 = d + 0.5;
  box(g, W5, 0.4, 0.22, M.roof, 0, ry, D5 / 2 - 0.11);
  box(g, W5, 0.4, 0.22, M.roof, 0, ry, -D5 / 2 + 0.11);
  box(g, 0.22, 0.4, d + 0.06, M.roof, W5 / 2 - 0.11, ry, 0);
  box(g, 0.22, 0.4, d + 0.06, M.roof, -W5 / 2 + 0.11, ry, 0);
  box(g, w + 0.06, 0.02, d + 0.06, M.roofIn, 0, ry, 0);
  box(g, 5.4, 1.0, 0.18, M.polBlue, 0, ry, D5 / 2 - 0.5);
  const s2 = new THREE.Mesh(new THREE.PlaneGeometry(5.0, 0.8), SIGN_POLIZIA); s2.position.set(0, ry + 0.5, D5 / 2 - 0.4); g.add(s2);
  box(g, 0.35, 0.22, 0.35, M.sirenR, -2.5, ry + 1.0, D5 / 2 - 0.5);
  box(g, 0.35, 0.22, 0.35, M.sirenB, 2.5, ry + 1.0, D5 / 2 - 0.5);
  cyl(g, 0.05, 0.07, 3.2, M.pole, w / 2 - 1, ry, -d / 2 + 1, 6);
  box(g, 0.9, 0.05, 0.05, M.pole, w / 2 - 1, ry + 2.6, -d / 2 + 1);
  addAC(g, -w / 4, ry, -d / 4, 0); addAC(g, 0.3, ry, -d / 4, 0);
  // bandiera

  g.userData.front = fz + 2.3;

}

/* =====================================================================
   LIVELLO DI DETTAGLIO: da lontano persone e veicoli sono una sola mesh statica
   ===================================================================== */
const lodObjects = new Set();
let lodFar = true;
function withLOD(build) {
  const near = build(), far = build();
  far.traverse(o => { o.userData.dynamic = false; });
  bake(far);
  const root = new THREE.Group(); root.add(near, far);
  root.userData = { ...near.userData, lod: { near, far } };
  near.visible = !lodFar; far.visible = lodFar;
  lodObjects.add(root.userData.lod);
  return root;
}
function setLOD(far) {
  if (far === lodFar) return;
  lodFar = far;
  for (const l of lodObjects) { l.near.visible = !far; l.far.visible = far; }
}

function createPerson(o) {
  const g = new THREE.Group();
  const fat = o.fat ? 1.28 : 1, TW = 0.44 * fat, TD = 0.27 * fat;
  const skin = mat(o.skin), top = mat(o.top), pants = mat(o.pants), hairM = mat(o.hair);
  const legM = o.skirt || o.shorts ? mat(o.legs || o.skin) : pants;
  // busto
  rbox(g, TW, 0.64, TD, 0.1, top, 0, 0.84, 0);
  if (o.shirt) box(g, 0.14, 0.44, 0.03, mat(o.shirt), 0, 1.04, TD / 2 - 0.005);
  if (o.tie) box(g, 0.06, 0.36, 0.03, mat(o.tie), 0, 1.08, TD / 2 + 0.01);
  if (o.belt) { box(g, TW + 0.02, 0.07, TD + 0.02, M.shoe, 0, 0.86, 0); box(g, 0.09, 0.07, 0.02, M.gold, 0, 0.86, TD / 2 + 0.01); }
  if (o.badge) box(g, 0.07, 0.08, 0.02, M.gold, -TW * 0.25, 1.26, TD / 2 + 0.005);
  if (o.skirt) cyl(g, TW / 2 + 0.01, TW / 2 + 0.08, 0.42, pants, 0, 0.5, 0, 12);
  // testa
  cyl(g, 0.07, 0.08, 0.12, skin, 0, 1.46, 0, 8);
  const head = sph(g, 0.215, skin, 0, 1.74, 0, 10, 7); head.scale.set(1, 1.07, 0.97);
  sph(g, 0.024, M.shoe, -0.075, 1.77, 0.198, 6, 4); sph(g, 0.024, M.shoe, 0.075, 1.77, 0.198, 6, 4);
  sph(g, 0.035, skin, 0, 1.71, 0.215, 6, 4);
  if (o.hairStyle !== 'bald') {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.228, 10, 5, 0, Math.PI * 2, 0, Math.PI * 0.52), hairM);
    cap.position.set(0, 1.76, -0.015); cap.rotation.x = -0.32; g.add(cap);

  if (o.hairStyle === 'bob') rbox(g, 0.47, 0.3, 0.3, 0.1, hairM, 0, 1.55, -0.07);
  if (o.beard) rbox(g, 0.3, 0.17, 0.14, 0.06, hairM, 0, 1.53, 0.12);
  if (o.hat === 'police') {
    cyl(g, 0.245, 0.215, 0.14, M.polNavy, 0, 1.87, -0.01, 14);
    cyl(g, 0.222, 0.222, 0.05, M.shoe, 0, 1.86, -0.01, 14);
    box(g, 0.3, 0.025, 0.15, M.shoe, 0, 1.86, 0.2);
    box(g, 0.07, 0.07, 0.02, M.gold, 0, 1.93, 0.215);
  }
  if (o.vest) for (const yy of [0.98, 1.22]) box(g, TW + 0.015, 0.06, TD + 0.015, M.white, 0, yy, 0);
  if (o.hat === 'hard') {
    const hh = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2), M.cheese); hh.position.set(0, 1.8, 0); g.add(hh);
    cyl(g, 0.29, 0.29, 0.03, M.cheese, 0, 1.79, 0.02, 14);
  }
  if (o.hat === 'sun') { cyl(g, 0.36, 0.36, 0.03, mat('#f1e2b0'), 0, 1.88, 0, 14); cyl(g, 0.2, 0.22, 0.14, mat('#f1e2b0'), 0, 1.9, 0, 12); }
  // gambe e braccia (articolate)

function hullGeo(L, W, H, bow) {
  const s = new THREE.Shape();
  s.moveTo(-L / 2, -W / 2); s.lineTo(L / 2 - bow, -W / 2);
  s.quadraticCurveTo(L / 2, -W * 0.3, L / 2, 0);
  s.quadraticCurveTo(L / 2, W * 0.3, L / 2 - bow, W / 2);
  s.lineTo(-L / 2, W / 2); s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: H, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06, bevelSegments: 1, curveSegments: 8 });
  geo.rotateX(-Math.PI / 2);
  return geo;
}
function hull(p, L, W, H, bow, m, y = 0, x = 0) { const o = new THREE.Mesh(hullGeo(L, W, H, bow), m); o.position.set(x, y, 0); p.add(o); return o; }

   ===================================================================== */
let beachSpots = [], benchSpots = [];
function buildWaterfront(root) {
  // lungomare
  const bW = XW - 6, bC = (-XW - 6) / 2, eW = XW + 6, eC = (XW - 6) / 2;
  box(root, 2 * XW, 4.7, 8, M.baseSide, 0, -4.7, 49);
  box(root, 2 * XW, 0.3, 8, M.pave, 0, 0, 49);
  // spiaggia (x -XW..-6)
  box(root, bW, 4.75, 10, M.sand, bC, -4.7, 58);
  const sl = box(root, bW - 0.4, 0.6, 7.4, M.sandWet, bC, -0.95, 65.5); sl.rotation.x = 0.1;
  // mare
  box(root, bW, 4.35, 37, M.sea, bC, -4.7, 81.5);
  box(root, eW, 4.35, 47, M.sea, eC, -4.7, 76.5);
  // molo con faro
  box(root, 4, 5.0, 37, M.concrete, -4, -4.7, 71.5);
  for (let z = 57; z < 86; z += 4) { addBollard(root, -5.7, 0.3, z); addBollard(root, -2.3, 0.3, z); }
  addLighthouse(root, -4, 0.3, 87.6);
  // marina: pontili in legno
  for (const fx of [4, 11, 18]) {
    box(root, 1.4, 0.18, 12, M.plank, fx, -0.18, 59);
    for (let z = 54.5; z <= 64.5; z += 2.5) for (const s of [-1, 1]) cyl(root, 0.09, 0.09, 1.0, M.plankDark, fx + s * 0.75, -0.6, z, 6);
  }
  // banchina commerciale con gru e container
  const qx1 = XW - 0.2;
  box(root, qx1 - 24, 5.0, 19, M.concrete, (24 + qx1) / 2, -4.7, 62.5);
  for (let z = 54.5; z < 72; z += 2.5) box(root, 0.25, 0.55, 0.9, M.rubber, 23.95, -0.45, z);
  for (let x = 25.5; x < qx1; x += 2.5) box(root, 0.9, 0.55, 0.25, M.rubber, x, -0.45, 72.05);
  for (let z = 55; z < 72; z += 4) addBollard(root, 24.5, 0.3, z);
  for (let x = 27; x < qx1; x += 4) addBollard(root, x, 0.3, 71.5);
  for (let x = 28; x <= qx1 - 3; x += 2.7) for (const z of [55.6, 56.8, 59.8, 61.0]) addContainerStack(root, x, z);
  addCrane(root, 36, 66); addCrane(root, 66, 66);
  // arredo del lungomare
  const KIOSKS = { '-60': ['#f2a7a0', SIGN_GELATI], '-28': ['#f7f1e3', SIGN_GELATI], '12': ['#8cc8ee', SIGN_BAR], '44': ['#f5c37c', SIGN_BAR] };
  for (let x = -80; x <= 80; x += 8) { box(root, 1.4, 0.4, 1.4, M.trim, x, 0.3, 49); box(root, 1.2, 0.02, 1.2, mat('#7a5a3a'), x, 0.7, 49); addPalm(root, x, 0.7, 49, rand(0.85, 1.05)); }
  for (let x = -76; x <= 76; x += 8) {
    if (KIOSKS[x]) { addKiosk(root, x, 49, ...KIOSKS[x]); continue; }
    addBench(root, x, 0.3, 49.6, 0); benchSpots.push([x, 49.6]);
  }
  for (let x = -78; x <= 78; x += 12) addLamp(root, x, 52.6, 0, -1);
  // spiaggia: ombrelloni, lettini, sdraio, teli, surf
  for (let x = -83; x <= -14; x += 6.2) for (const row of [0, 1]) {
    const z = row ? 60.2 : 56.2, ux = x + rand(-0.6, 0.6) + row * 3;
    addUmbrella(root, ux, z, pick(UCOL));
    const k = R();
    if (k < 0.5) { addLounger(root, ux - 0.55, z + 0.3); addLounger(root, ux + 0.55, z + 0.3); beachSpots.push({ x: ux - 0.55, z: z + 0.3, t: 'lounger' }, { x: ux + 0.55, z: z + 0.3, t: 'lounger' }); }
    else if (k < 0.8) { addDeckChair(root, ux - 0.5, z + 0.5, pick(UCOL)); addDeckChair(root, ux + 0.5, z + 0.5, pick(UCOL)); beachSpots.push({ x: ux + 1.4, z: z + 0.6, t: 'stand' }); }

function makePoly(pts) {
  const cum = [0];
  for (let k = 1; k < pts.length; k++) cum.push(cum[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
  return { pts, cum, len: cum[cum.length - 1] };
}
function samplePoly(p, s) {
  const c = p.cum; let k = 1;
  while (k < c.length - 1 && c[k] < s) k++;
  const a = p.pts[k - 1], b = p.pts[k], L = c[k] - c[k - 1] || 1;
  const t = Math.min(1, Math.max(0, (s - c[k - 1]) / L));
  return { x: a[0] + (b[0] - a[0]) * t, z: a[1] + (b[1] - a[1]) * t, dx: (b[0] - a[0]) / L, dz: (b[1] - a[1]) / L };
}
const rectLoop = (cx, cz, rx, rz) => makePoly([[cx - rx, cz - rz], [cx + rx, cz - rz], [cx + rx, cz + rz], [cx - rx, cz + rz], [cx - rx, cz - rz]]);

function updatePerson(p, dt, t) {
  const m = p.mesh;
  let moving = false;
  if (p.mode === 'walk') {
    if (p.pause > 0) p.pause -= dt;
    else {
      p.s = ((p.s + p.dir * p.speed * dt) % p.path.len + p.path.len) % p.path.len;
      moving = true;
      if (Math.random() < dt * 0.025) p.pause = 1.5 + Math.random() * 3;
    }
    const q = samplePoly(p.path, p.s);
    p.x = q.x; p.z = q.z;
    p.ang = lerpAngle(p.ang, Math.atan2(q.dx * p.dir, q.dz * p.dir), 1 - Math.exp(-8 * dt));
    m.position.set(p.x, p.y, p.z); m.rotation.y = p.ang;
  } else if (p.mode === 'roam') {             // calciatori: corrono verso un punto o verso il pallone
    const ball = life.ball;
    let tx = p.tx, tz = p.tz;
    if (ball && ball.target === p) { tx = ball.x; tz = ball.z; }
    else if (tx === undefined || Math.hypot(tx - p.x, tz - p.z) < 0.4) {
      const [x0, x1, z0, z1] = p.box;
      p.tx = tx = x0 + Math.random() * (x1 - x0); p.tz = tz = z0 + Math.random() * (z1 - z0);
    }
    const dx = tx - p.x, dz = tz - p.z, d = Math.hypot(dx, dz);
    if (d > 0.3) {
      const v = Math.min(d, p.speed * dt); p.x += dx / d * v; p.z += dz / d * v; moving = true;
      p.ang = lerpAngle(p.ang, Math.atan2(dx, dz), 1 - Math.exp(-8 * dt));
    }
    m.position.set(p.x, p.y, p.z); m.rotation.y = p.ang;
  }
  p.swing += ((moving ? 1 : 0) - p.swing) * Math.min(1, dt * 6);
  if (moving) p.phase += dt * p.speed * 6.5 / p.sc;
  const [lL, lR] = p.legs, [aL, aR] = p.arms;
  if (p.mode === 'walk' || p.mode === 'idle' || p.mode === 'roam') {
    const sw = Math.sin(p.phase) * p.swing, br = Math.sin(t * 1.5 + p.phase) * 0.03 * (1 - p.swing);
    lL.rotation.x = sw * 0.6; lR.rotation.x = -sw * 0.6;
    aL.rotation.x = -sw * 0.5; aR.rotation.x = sw * (p.item ? 0.15 : 0.5);
    aL.rotation.z = -0.05 - br; aR.rotation.z = 0.05 + br;
  } else if (p.mode === 'direct') {           // vigile che dirige il traffico
    aR.rotation.set(0, 0, Math.PI * 0.5);
    aL.rotation.set(-1.3 + Math.sin(t * 3.2 + p.phase) * 0.45, 0, -0.2);
    m.rotation.y = p.ang + Math.sin(t * 0.4 + p.phase) * 0.6;
  } else if (p.mode === 'swim') {
    aL.rotation.x = t * 3 + p.phase; aR.rotation.x = t * 3 + p.phase + Math.PI;
    m.position.y = p.y + Math.sin(t * 2 + p.phase) * 0.06;
  } else if (p.mode === 'sit') {
    lL.rotation.x = lR.rotation.x = -1.45; aL.rotation.x = aR.rotation.x = -0.35;
  }
}
function updateDog(d, dt, t) {
  const o = d.owner, fx = Math.sin(o.ang), fz = Math.cos(o.ang), rx = -fz, rz = fx;
  const k = d.init ? Math.min(1, dt * 6) : 1; d.init = true;
  d.x +=(o.x + fx * 0.9 + rx * 0.5 - d.x) * k; d.z += (o.z + fz * 0.9 + rz * 0.5 - d.z) * k;
  d.mesh.position.set(d.x, o.y, d.z);
  d.mesh.rotation.y = lerpAngle(d.mesh.rotation.y, o.ang, k);
  const sw = Math.sin(o.phase * 1.6) * o.swing * 0.7;
  d.legs[0].rotation.x = d.legs[3].rotation.x = sw; d.legs[1].rotation.x = d.legs[2].rotation.x = -sw;
  d.tail.rotation.z = Math.sin(t * 10) * 0.45;
  const a = d.leash.geometry.attributes.position, hs = 0.3 * o.sc;
  a.setXYZ(0, o.x + rx * hs, o.y + 0.7 * o.sc / 0.85, o.z + rz * hs);
  a.setXYZ(1, d.x + fx * 0.28, o.y + 0.5, d.z + fz * 0.28);
  a.needsUpdate = true;
}
function updateLife(dt, t) {
  for (const p of life.people) updatePerson(p, dt, t);
  for (const d of life.dogs) updateDog(d, dt, t);
  for (const c of life.cats) c.tail.rotation.y = Math.sin(t * 1.4 + c.ph) * 0.6;
  for (const b of life.pigeons) {
    b.head.rotation.x = Math.max(0, Math.sin(t * 3 + b.ph)) * 0.9;
    if (Math.random() < dt * 0.3) b.mesh.rotation.y += (Math.random() - 0.5) * 2;
  }
  for (const g of life.gulls) {
    g.t += dt * g.w;
    const x = g.cx + g.r * Math.cos(g.t), z = g.cz + g.r * Math.sin(g.t);
    const dx = -Math.sin(g.t) * g.w, dz = Math.cos(g.t) * g.w;
    g.mesh.position.set(x, g.h + Math.sin(t * 0.8 + g.ph) * 0.6, z);
    g.mesh.rotation.y = Math.atan2(dx, dz); g.mesh.rotation.z = -Math.sign(g.w) * 0.35;
    const glide = Math.sin(t * 0.6 + g.ph) > 0.3 ? 0.12 : 1;
    const f = Math.sin(t * 9 + g.ph) * 0.6 * glide;
    g.wings[0].rotation.z = -f; g.wings[1].rotation.z = f;
  }
  for (const b of life.boats) {
    const m = b.mesh;
    if (b.moving) {
      b.t += dt * b.w;
      b.x = b.cx + b.rx * Math.cos(b.t); b.z = b.cz + b.rz * Math.sin(b.t);
      const dx = -b.rx * Math.sin(b.t) * b.w, dz = b.rz * Math.cos(b.t) * b.w;
      m.position.x = b.x; m.position.z = b.z;
      m.rotation.y = Math.atan2(-dz, dx);
      m.rotation.x = Math.sign(b.w) * 0.08;
      m.rotation.z = 0.04;
    } else m.rotation.x = Math.sin(t * 0.9 + b.ph) * 0.02 * b.amp;
    m.position.y = b.y + Math.sin(t * 1.3 + b.ph) * 0.05 * b.amp;
  }
  life.lhBeam.rotation.y += dt * 0.8;
  if (life.ball) {                            // il pallone passa da un giocatore all'altro
    const b = life.ball, tp = b.target, dx = tp.x - b.x, dz = tp.z - b.z, d = Math.hypot(dx, dz);
    if (d < 0.5) b.target = b.players[Math.floor(Math.random() * b.players.length)];
    else { const v = Math.min(d, 9 * dt); b.x += dx / d * v; b.z += dz / d * v; }
    b.mesh.position.set(b.x, 0.58 + Math.abs(Math.sin(t * 5)) * 0.3, b.z);
  }
}

function buildRoadTile(root, t) {
  const { cx, cz, conn } = t;
  box(root, TILE, 0.4, TILE, M.asphalt, cx, -0.4, cz);
  // marciapiedi sui lati non collegati
  for (let s = 0; s < 4; s++) {
    if (conn[s]) continue;
    const odd = s % 2 === 1, nP = conn[(s + 1) % 4], nM = conn[(s + 3) % 4];
    const l1 = HALF - (odd && !nP ? SIDEWALK : 0), l0 = -HALF + (odd && !nM ? SIDEWALK : 0);
    pbox(root, cx, cz, s, H2, (l0 + l1) / 2, SIDEWALK, l1 - l0, SW_H, M.pave);
    const c1 = HALF - (!nP ? SIDEWALK - 0.22 : 0), c0 = -HALF + (!nM ? SIDEWALK - 0.22 : 0);
    pbox(root, cx, cz, s, HALF - SIDEWALK + 0.11, (c0 + c1) / 2, 0.22, c1 - c0, SW_H + 0.05 + (odd ? 0.003 : 0), M.curb);
  }
  // angoli fra due lati collegati
  for (let s = 0; s < 4; s++) {
    if (!(conn[s] && conn[(s + 1) % 4])) continue;
    pbox(root, cx, cz, s, H2, H2, SIDEWALK, SIDEWALK, SW_H, M.pave);
    pbox(root, cx, cz, s, HALF - SIDEWALK + 0.11, H2, 0.22, SIDEWALK, SW_H + 0.05, M.curb);
    pbox(root, cx, cz, s, H2, HALF - SIDEWALK + 0.11, SIDEWALK, 0.22, SW_H + 0.053, M.curb);
  }
  const nConn = conn.filter(Boolean).length;
  const straight = nConn === 2 && conn[0] === conn[2];

  if (straight) {
    const s0 = conn[0] ? 0 : 1;
    const crossAt = {};
    for (const e of [s0, s0 + 2]) {
      const nb = tileAt(t.i + DIRS[e][0], t.j + DIRS[e][1]);
      if (!(nb && nb.inter)) continue;
      crossAt[e] = true;
      for (let k = 0; k < 8; k++) pbox(root, cx, cz, e, HALF - 1.35, -3.15 + k * 0.9, 2.0, 0.5, 0.02, M.line); // strisce pedonali
      pbox(root, cx, cz, e, 2.2, LANE, 0.3, 3.2, 0.02, M.line);                                           // linea di stop
      if (R() < 0.45) { const [hx, hz] = fr(cx, cz, e, 1.2, (R() < 0.5 ? 1 : -1) * CURB_IN); addHydrant(root, hx, hz); }
    }

      if (a < -2 && crossAt[s0]) continue;
      pbox(root, cx, cz, s0 + 2, a, 0, 1.4, 0.16, 0.02, M.line); // tratteggio
    }
    const ls = (t.i + t.j) % 2 === 0 ? (s0 + 1) % 4 : (s0 + 3) % 4;
    const [lx, lz] = DIRS[ls];
    addLamp(root, cx + lx * CURB_IN, cz + lz * CURB_IN, -lx, -lz);
  } else if (nConn === 2) {
    // curva: lampione nell'angolo esterno
    const un = [0, 1, 2, 3].filter(s => !conn[s]);
    const vx = DIRS[un[0]][0] + DIRS[un[1]][0], vz = DIRS[un[0]][1] + DIRS[un[1]][1];
    addLamp(root, cx + vx * (HALF - 0.65), cz + vz * (HALF - 0.65), -vx, -vz);
  }

  if (t.inter) {
    t.swap = R() < 0.5 ? 1 : 0;            // fase normale o invertita (materiali condivisi fra tutti gli incroci)
    for (let s = 0; s < 4; s++) {
      if (!conn[s]) continue;
      const h = (s + 2) % 4, rd = (h + 1) % 4;
      const x = cx + DIRS[s][0] * CURB_IN + DIRS[rd][0] * CURB_IN, z = cz + DIRS[s][1] * CURB_IN + DIRS[rd][1] * CURB_IN;
      addTrafficLight(root, x, z, s, LIGHT_MATS[(s % 2) ^ t.swap], R() < 0.5);
    }
  }
}

    case 'towers': return buildBlock(root, cx, cz, { towers: true, ff: { a: 1, b: 2, kind: 'burger' } });
    case 'housesFries': return buildBlock(root, cx, cz, { ff: { a: 2, b: 1, kind: 'fries' } });
    case 'housesBurger': return buildBlock(root, cx, cz, { ff: { a: 1, b: 2, kind: 'burger' } });
    default: return buildBlock(root, cx, cz);
  }
}
function buildBlock(root, cx, cz, opt = {}) {
  const S = 3 * TILE, police = !!opt.police;
  box(root, S, 0.7, S, M.pave, cx, -0.4, cz);
  for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) {
    const x = cx + (a - 1) * TILE, z = cz + (b - 1) * TILE;
    if (police && a === 1 && b === 1) { buildParking(root, x, z); continue; }
    if (a === 1 && b === 1) { buildPark(root, x, z); continue; }
    const f = b === 0 ? 0 : b === 2 ? 2 : a === 0 ? 3 : 1;
    const [fx, fz] = DIRS[f];
    if (opt.ff && a === opt.ff.a && b === opt.ff.b) {
      const s = createFastFood(opt.ff.kind);
      const off = HALF - 0.6 - s.userData.front;
      s.position.set(x + fx * off, 0.3, z + fz * off); s.rotation.y = Math.atan2(fx, fz);
      root.add(s); continue;
    }
    if (opt.towers && R() < 0.55) {
      const t = createApartmentTower(R() < 0.5 ? 'pink' : 'cream');
      const off = HALF - 0.6 - t.userData.front;
      t.position.set(x + fx * off, 0.3, z + fz * off); t.rotation.y = Math.atan2(fx, fz);
      root.add(t); continue;
    }
    if (police && a === 1 && b === 2) {
      const st = createPoliceStation();
      const off = HALF - 0.6 - st.userData.front;
      st.position.set(x + fx * off, 0.3, z + fz * off); st.rotation.y = Math.atan2(fx, fz);
      root.add(st); continue;
    }
    if (R() < 0.1) { // giardinetto
      box(root, 7, 0.06, 7, M.grass, x, 0.3, z);
      for (let k = 0; k < 4; k++) addTree(root, x + rand(-2.5, 2.5), 0.36, z + rand(-2.5, 2.5), rand(0.7, 1.1));
      continue;
    }
    const bld = createBuilding(randomBuildingOpts());
    const off = HALF - 0.6 - bld.userData.front;
    bld.position.set(x + fx * off, 0.3, z + fz * off);
    bld.rotation.y = Math.atan2(fx, fz);
    root.add(bld);
  }
  // alberelli lungo il perimetro, fra un lotto e l'altro
  for (const s of [-1, 1]) for (const e of [-1, 1]) for (const side of [0, 1]) {
    if (R() < 0.5) continue;
    const along = s * TILE / 2, edge = e * (S / 2 - 0.7);
    const x = side ? cx + along : cx + edge, z = side ? cz + edge : cz + along;
    addTree(root, x, 0.3, z, rand(0.6, 0.8));
  }
}

function buildCity(seed) {
  R = mulberry32(seed);
  const root = new THREE.Group();
  grid = []; interTiles = []; straightTiles = []; anims = []; cafeSeats = [];
  for (let i = 0; i < NX; i++) {
    grid.push([]);
    for (let j = 0; j < NZ; j++) {
      const road = isRoadIdx(i, j);
      const conn = DIRS.map(([dx, dz]) => road && isRoadIdx(i + dx, j + dz));
      const n = conn.filter(Boolean).length;
      grid[i].push({ i, j, cx: (i - (NX - 1) / 2) * TILE, cz: (j - (NZ - 1) / 2) * TILE + OZ, road, conn, inter: n >= 3 });
    }
  }
  // base del plastico
  const SX = NX * TILE + 3, SZ = NZ * TILE + 3;
  box(root, SX, 0.3, SZ, M.pave2, 0, -0.7, OZ);
  box(root, SX, 4, SZ, M.baseSide, 0, -4.7, OZ);
  for (const row of grid) for (const t of row) if (t.road) {
    buildRoadTile(root, t);
    if (t.inter) interTiles.push(t);
    if (t.conn.filter(Boolean).length === 2 && t.conn[0] === t.conn[2]) straightTiles.push(t);
  }
  for (let bi = 0; bi * 4 + 4 < NX; bi++) for (let bj = 0; bj * 4 + 4 < NZ; bj++) {
    const c = grid[bi * 4 + 2][bj * 4 + 2];
    buildAnyBlock(root, c.cx, c.cz);
  }
  beachSpots = []; benchSpots = [];
  buildWaterfront(root);
  return bake(root);
}

/* =====================================================================
   TRAFFICO
   ===================================================================== */
let lightClock = 0;
function axisState(axis) {
  const p = lightClock % CYCLE, q = axis === 0 ? p : (p + 11) % CYCLE;
  return q < 8 ? 'G' : q < 10 ? 'Y' : 'R';
}
const lightState = (t, axis) => axisState(axis ^ t.swap);
function updateLights(dt) {
  lightClock += dt;
  for (let axis = 0; axis < 2; axis++) {
    const st = axisState(axis), m = LIGHT_MATS[axis];
    for (const [k, on] of [['r', st === 'R'], ['y', st === 'Y'], ['g', st === 'G']]) {
      m[k].emissiveIntensity = on ? 1.8 : 0;
      m[k].color.setHex(on ? m[k].userData.base : 0x3a3c42);
    }
  }
}

let pathCache = new Map();
function getPath(t, din, dout) {
  const key = `${t.i},${t.j},${din},${dout}`;
  if (pathCache.has(key)) return pathCache.get(key);
  const [ax, az] = DIRS[din], [rx, rz] = DIRS[(din + 1) % 4];
  const [bx, bz] = DIRS[dout], [qx, qz] = DIRS[(dout + 1) % 4];
  const sx = t.cx - ax * HALF + rx * LANE, sz = t.cz - az * HALF + rz * LANE;
  const ex = t.cx + bx * HALF + qx * LANE, ez = t.cz + bz * HALF + qz * LANE;
  let pts;
  if (din === dout) pts = [[sx, sz], [ex, ez]];
  else {
    const px = ax !== 0 ? ex : sx, pz = ax !== 0 ? sz : ez; // punto di controllo bezier
    pts = [];
    for (let k = 0; k <= 24; k++) {
      const u = k / 24, a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
      pts.push([a * sx + b * px + c * ex, a * sz + b * pz + c * ez]);
    }
  }
  const cum = [0];
  for (let k = 1; k < pts.length; k++) cum.push(cum[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
  const p = { pts, cum, len: cum[cum.length - 1], turn: din !== dout };
  pathCache.set(key, p);
  return p;
}
function samplePath(p, s) {
  const c = p.cum; let k = 1;
  while (k < c.length - 1 && c[k] < s) k++;
  const t = c[k] > c[k - 1] ? Math.min(1, Math.max(0, (s - c[k - 1]) / (c[k] - c[k - 1]))) : 0;
  const a = p.pts[k - 1], b = p.pts[k];
  return { x: a[0] + (b[0] - a[0]) * t, z: a[1] + (b[1] - a[1]) * t, ang: Math.atan2(-(b[1] - a[1]), b[0] - a[0]) };
}
function chooseDir(t, din) {
  const back = (din + 2) % 4, opts = [];
  for (let s = 0; s < 4; s++) if (t.conn[s] && s !== back) { opts.push(s); if (s === din) opts.push(s); } // preferisce dritto
  return opts.length ? mpick(opts) : back;
}

const cars = [], carsGroup = new THREE.Group();
let carId = 0;
const ACCEL = 4, DECEL = 7, V_TURN = 4.2, STOP_FROM_END = 4.9;

function spawnCar(type) {
  for (let attempt = 0; attempt < 60; attempt++) {
    const t = mpick(straightTiles);
    const din = (t.conn[0] ? [0, 2] : [1, 3])[Math.random() < 0.5 ? 0 : 1];
    const path = getPath(t, din, din);
    const s = 1 + Math.random() * 7;
    const p = samplePath(path, s);
    if (cars.some(c => (c.x - p.x) ** 2 + (c.z - p.z) ** 2 < 49)) continue;
    const kind = type || mpick(CAR_TYPES), color = mpick(CAR_COLORS);
    const mesh = withLOD(() => createCar(kind, color));
    const car = { id: carId++, kind, len: mesh.userData.len || 3.5,
      label: kind === 'police' ? 'Volante della polizia' : VAN_LABEL[kind] || `Auto #${carId}`, mesh, wheels: mesh.userData.wheels, tile: t, din, dout: din, path, s, v: 0,
                  maxV: 6 + Math.random() * 3, x: p.x, z: p.z, ang: p.ang, gap: Infinity, stuck: 0, ghost: 0 };
    mesh.userData.car = car;
    setNext(car);
    mesh.position.set(p.x, 0, p.z); mesh.rotation.y = p.ang;
    carsGroup.add(mesh); cars.push(car);
    return car;
  }
  return null;
}
function setNext(car) {
  const [dx, dz] = DIRS[car.dout];
  car.nextTile = tileAt(car.tile.i + dx, car.tile.j + dz);
  car.nextDout = chooseDir(car.nextTile, car.dout);
  car.nextPath = getPath(car.nextTile, car.dout, car.nextDout);
}
function advanceTile(car) {
  car.tile = car.nextTile; car.din = car.dout; car.dout = car.nextDout; car.path = car.nextPath;
  setNext(car);
}
function removeCar() {
  const car = cars.pop(); if (!car) return;
  carsGroup.remove(car.mesh);
  lodObjects.delete(car.mesh.userData.lod);
  car.mesh.traverse(o => o.isMesh && o.geometry.dispose());
  if (follow === car) setFollow(null);
}
// distanza libera davanti ad a, rispetto a b (Infinity se b non è davanti)
function gapTo(a, b) {
  const dx = b.x - a.x, dz = b.z - a.z;
  const fx = Math.cos(a.ang), fz = -Math.sin(a.ang);
  const along = dx * fx + dz * fz;
  if (along <= 0 || along > 12) return Infinity;
  if (Math.abs(dx * fz - dz * fx) > 1.6) return Infinity;
  return along - (a.len + b.len) / 2 - 0.8;
}
function lerpAngle(a, b, k) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * k; }

function updateCars(dt) {
  for (const a of cars) {
    a.gap = Infinity;
    if (a.ghost > 0) { a.ghost -= dt; continue; }
    for (const b of cars) {
      if (a === b) continue;
      const g = gapTo(a, b);
      if (g < a.gap) {
        if (gapTo(b, a) < Infinity && a.id < b.id) continue; // blocco reciproco: passa l'id minore
        a.gap = g;
      }
    }
  }
  for (const c of cars) {
    const p = c.path;
    let vmax = p.turn ? Math.min(c.maxV, V_TURN) : c.maxV;
    const remaining = p.len - c.s;
    if (!p.turn && c.nextPath.turn) vmax = Math.min(vmax, Math.sqrt(V_TURN * V_TURN + 2 * DECEL * 0.6 * remaining));
    // semaforo
    let atRed = false;
    if (c.nextTile.inter && !p.turn) {
      const stopS = p.len - (STOP_FROM_END - 1.75 + c.len / 2);
      if (c.s <= stopS + 0.05) {
        const st = lightState(c.nextTile, c.dout % 2), gap = stopS - c.s;
        const mustStop = st === 'R' || (st === 'Y' && c.v * c.v / (2 * DECEL) < gap + 0.3);
        if (mustStop) { vmax = Math.min(vmax, gap < 0.05 ? 0 : Math.sqrt(2 * DECEL * gap)); atRed = true; }
      }
    }
    // auto davanti
    if (c.gap < Infinity) vmax = Math.min(vmax, c.gap <= 0 ? 0 : Math.sqrt(2 * DECEL * c.gap));
    c.v = c.v < vmax ? Math.min(vmax, c.v + ACCEL * dt) : Math.max(vmax, c.v - DECEL * 3 * dt);
    // anti-stallo negli incroci
    const inJunction = c.tile.inter || p.turn;
    if (c.v < 0.1 && c.gap < Infinity && !atRed && inJunction) { c.stuck += dt; if (c.stuck > 5) { c.ghost = 2; c.stuck = 0; } }
    else c.stuck = 0;

    const ds = c.v * dt;
    c.s += ds;
    while (c.s >= c.path.len) { c.s -= c.path.len; advanceTile(c); }
    const q = samplePath(c.path, c.s);
    c.x = q.x; c.z = q.z;
    c.ang = lerpAngle(c.ang, q.ang, 1 - Math.exp(-18 * dt));
    c.mesh.position.set(c.x, 0, c.z);
    c.mesh.rotation.y = c.ang;
    for (const w of c.wheels) w.rotation.z -= ds / 0.34;
    if (c.mesh.userData.drum) c.mesh.userData.drum.rotation.x += dt * 1.5;
  }
}

/* =====================================================================
   SCENA, LUCI, CAMERA
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#5b616d');
const hemi = new THREE.HemisphereLight('#ffffff', '#9aa0ad', 1.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff6ea', 2.6);
const CENTER = new THREE.Vector3(0, 0, -4);
sun.position.set(CENTER.x - 35, 70, CENTER.z + 45);
sun.target.position.copy(CENTER);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -125, right: 125, top: 125, bottom: -125, near: 1, far: 320 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
scene.add(carsGroup);

const VIEW = 150;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);
camera.position.set(CENTER.x + 100, 90, CENTER.z + 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(CENTER);
controls.zoomToCursor = true;
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.46;
controls.minZoom = 0.6; controls.maxZoom = 12; controls.autoRotateSpeed = 0.6;
function resize() {
  const a = innerWidth / innerHeight;
  Object.assign(camera, { left: -VIEW * a / 2, right: VIEW * a / 2, top: VIEW / 2, bottom: -VIEW / 2 });
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize); resize();

/* =====================================================================
   UI
   ===================================================================== */
const $ = id => document.getElementById(id);
let paused = false, night = false, follow = null;
function refreshCount() { $('count').textContent = cars.length; }
function setFollow(car) {
  follow = car;
  $('follow').textContent = car ? `Segui: ${car.label} (click a vuoto per uscire)` : '';
  $('followBtn').classList.toggle('on', !!car);
  const z = car && car.mesh && car.mesh.userData.agent && car.sc ? 4.5 : 2.4;  // più vicino per le persone
  if (car && camera.zoom < z) { camera.zoom = z; camera.updateProjectionMatrix(); }
}
function setNight(on) {
  night = on;
  scene.background.set(on ? '#1a1f2e' : '#5b616d');
  hemi.intensity = on ? 0.4 : 1.5; hemi.color.set(on ? '#8fa3d8' : '#ffffff'); hemi.groundColor.set(on ? '#2a2f40' : '#9aa0ad');
  sun.intensity = on ? 0.45 : 2.6; sun.color.set(on ? '#9fb2ff' : '#fff6ea');
  M.glassLit.emissiveIntensity = on ? 1.3 : 0;
  M.lamp.emissiveIntensity = on ? 3 : 0.25;
  M.headlight.emissiveIntensity = on ? 3 : 0.2;
  M.tail.emissiveIntensity = on ? 2 : 0.15;
  M.glow.opacity = on ? 0.55 : 0; M.beam.opacity = on ? 0.4 : 0;
  M.lightHouse.emissiveIntensity = on ? 4 : 0.3; M.lhBeam.opacity = on ? 0.35 : 0;
  M.glow.visible = M.beam.visible = M.lhBeam.visible = on;     // di giorno non vengono proprio disegnati
  M.sea.color.set(on ? '#3f6f9a' : '#79cdef');
  $('night').textContent = on ? 'Giorno' : 'Notte';
  $('night').classList.toggle('on', on);
}
function newCity(seed) {
  const n = cars.length || 48;
  while (cars.length) removeCar();
  if (cityRoot) {
    scene.remove(cityRoot);
    cityRoot.traverse(o => o.isMesh && o.geometry.dispose());
  }
  if (life) { scene.remove(life.group); life.group.traverse(o => (o.isMesh || o.isLine) && o.geometry.dispose()); }
  lodObjects.clear();
  pathCache = new Map();
  cityRoot = buildCity(seed);
  scene.add(cityRoot);
  scene.add(buildLife());
  for (let k = 0; k < n; k++) spawnCar(k < 4 ? 'police' : undefined);
  if (typeof quality !== 'undefined' && quality !== 'alta') { applyCastShadow(carsGroup); applyCastShadow(life.group); }
  refreshCount();
}
$('carPlus').onclick = () => { for (let k = 0; k < 2; k++) { const c = spawnCar(); if (c && quality !== 'alta') applyCastShadow(c.mesh); } refreshCount(); };
$('carMinus').onclick = () => { for (let k = 0; k < 2; k++) removeCar(); refreshCount(); };
$('night').onclick = () => setNight(!night);
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Riprendi' : 'Pausa'; $('pause').classList.toggle('on', paused); };
$('rotate').onclick = () => { controls.autoRotate = !controls.autoRotate; $('rotate').classList.toggle('on', controls.autoRotate); };
$('newCity').onclick = () => { setFollow(null); newCity((Math.random() * 1e9) | 0); };
$('followBtn').onclick = () => setFollow(follow ? null : mpick(cars));

// qualità grafica: "bassa" = risoluzione 1x, ombre più piccole e niente ombre di auto/persone
let quality = 'alta';
function applyCastShadow(root) {
  const cast = quality === 'alta';
  root.traverse(o => { if (o.isMesh && !o.material.transparent && !o.userData.noShadow) o.castShadow = cast; });
}
function setQuality(q) {
  quality = q;
  renderer.setPixelRatio(q === 'alta' ? Math.min(devicePixelRatio, 2) : 1);
  const size = q === 'alta' ? 4096 : 2048;
  if (sun.shadow.mapSize.x !== size) { sun.shadow.mapSize.set(size, size); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } }
  applyCastShadow(carsGroup); if (life) applyCastShadow(life.group);
  $('quality').textContent = 'Qualità: ' + q;
  resize();
}
$('quality').onclick = () => setQuality(quality === 'alta' ? 'bassa' : 'alta');

// click su un'auto per seguirla
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects([...carsGroup.children, ...life.group.children], true)[0];
  let o = hit && hit.object;
  while (o && !o.userData.car && !o.userData.agent) o = o.parent;
  setFollow(o ? (o.userData.car || o.userData.agent) : null);
});

/* =====================================================================
   LOOP
   ===================================================================== */
newCity(20261124);
setNight(false);
const clock = new THREE.Clock();
let simTime = 0;
// qualità automatica: misura gli FPS nei primi secondi e, se la macchina fatica, passa a "bassa"
{
  let n = 0, t0 = 0;
  const probe = now => {
    if (!t0) t0 = now;
    n++;
    if (now - t0 < 3000) requestAnimationFrame(probe);
    else if (n / ((now - t0) / 1000) < 28 && quality === 'alta') setQuality('bassa');
  };
  setTimeout(() => requestAnimationFrame(probe), 1500);
}
window.__city = { renderer, scene, sun, camera, controls, get cars() { return cars; }, get life() { return life; } };   // per il debug da console
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) {
    simTime += dt;
    updateLights(dt); updateCars(dt); updateLife(dt, simTime);
    for (const f of anims) f(dt, simTime);
    const on = (simTime * 3) % 2 < 1;             // lampeggianti polizia
    M.sirenR.emissiveIntensity = on ? 2.5 : 0.1; M.sirenB.emissiveIntensity = on ? 0.1 : 2.5;
  }
  if (follow) {
    const k = 1 - Math.exp(-5 * dt), dx = (follow.x - controls.target.x) * k, dz = (follow.z - controls.target.z) * k;
    controls.target.x += dx; controls.target.z += dz;
    camera.position.x += dx; camera.position.z += dz;
  }
  controls.update();
  setLOD(camera.zoom < 2.2);
  renderer.render(scene, camera);
});
</script>
